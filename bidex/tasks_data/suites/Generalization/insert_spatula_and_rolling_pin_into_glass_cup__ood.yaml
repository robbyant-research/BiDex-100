# OOD variant of tabletop_insert_utensils_into_mug (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + baked distractors
# (random 5.3 injection disabled: an injected cup landed a few cm from the
# spatula; a mug + a can are baked near the old glass cup / below it instead).
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
fixtures: []
goal:
- type: lifted
  args:
  - glass_cup
  subtask: Pick up the glass cup
  threshold: 0.9
- type: 'on'
  args:
  - glass_cup
  - placemat
  subtask: Place the glass cup on the placemat
  threshold: 0.1
  must_hold: true
- type: lifted
  args:
  - spatula
  subtask: Pick up the spatula
  threshold: 0.85
- type: inside
  args:
  - spatula
  - glass_cup
  subtask: Insert the spatula into the glass cup
  threshold: 0.05
  must_hold: true
- type: lifted
  args:
  - rolling_pin
  subtask: Pick up the rolling pin
  threshold: 0.85
- type: inside
  args:
  - rolling_pin
  - glass_cup
  subtask: Insert the rolling pin into the glass cup
  threshold: 0.05
  must_hold: true
language: Pick up the glass cup, then insert the spatula into the cup, insert the rolling pin into the cup, and place the cup on the placemat.
subtasks:
- name: Pick up the glass cup
  score: 15
- name: Place the glass cup on the placemat
  score: 15
- name: Pick up the spatula
  score: 15
- name: Insert the spatula into the glass cup
  score: 20
- name: Pick up the rolling pin
  score: 15
- name: Insert the rolling pin into the glass cup
  score: 20
ood:
  base_task: tabletop_insert_utensils_into_mug
  scene_randomize: true
  baked_layout: true
name: insert_spatula_and_rolling_pin_into_glass_cup
obj_of_interest:
- glass_cup
- spatula
- rolling_pin
- placemat
objects:
- name: glass_cup
  region: glass_cup_zone
  scale: 1.2
  freejoint: true
  mass: 0.65
- name: spatula
  region: spatula_zone
  scale: 1
  freejoint: true
- name: rolling_pin
  region: rolling_pin_zone
  scale: 1
  freejoint: true
- name: placemat
  region: placemat_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/mug/mug_9
  region: ood_mug_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/canned_food/canned_food_0
  region: ood_can_zone
  scale: 1
  freejoint: true
regions:
  glass_cup_zone:
    center:
    - -0.22
    - 0.04
    - 0.85
    # Jitter tightened (0.08 -> 0.04) and the spatula moved to x 0.04 so the
    # cup's worst-case right edge (>= -0.094) stays clear of the spatula's
    # worst-case left edge (<= -0.077): the previous spread let the two reach
    # each other by up to ~4 cm at spawn.
    xy_range:
    - 0.04
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  placemat_zone:
    center:
    - 0.1769
    - -0.1969
    - 0.85
    xy_range:
    - 0.1
    - 0.1
    yaw_range:
    - -0.15
    - 0.15
  rolling_pin_zone:
    # Rolling pin at +x (x 0.18), separated from the spatula at x 0.0. Both are
    # ~0.23 m long (along y) so x separation 0.18 keeps their footprints clear.
    center:
    - 0.2255
    - 0.21
    - 0.85
    xy_range:
    - 0.03
    - 0.03
    yaw_range:
    - -0.4
    - 0.4
  spatula_zone:
    # Spatula at x 0.04 (clear of the rolling pin at x 0.226 -- that pair is
    # flat-vs-flat anyway -- and of the glass_cup at x -0.22 whose worst right
    # edge -0.094 stays 1.7 cm left of the spatula's worst left edge -0.077).
    center:
    - 0.04
    - 0.21
    - 0.85
    xy_range:
    - 0.03
    - 0.03
    yaw_range:
    - -0.4
    - 0.4
  # Baked OOD distractors (random 5.3 injection disabled -- an injected cup used
  # to land in the slot at (0.15,0.28), a few cm from the spatula's body). New
  # mug sits NEAR the old glass_cup (centre -0.22,0.04) and far from the spatula
  # (x max -0.17 vs spatula x min -0.116): mug box x[-0.33,-0.17] y[0.22,0.34];
  # can box x[-0.315,-0.185] y[-0.315,-0.185] (below cup, left of placemat).
  ood_mug_zone:
    center:
    - -0.25
    - 0.28
    - 0.8
    xy_range:
    - 0.015
    - 0.01
    yaw_range:
    - 1.5
    - 1.7
    rest_on_surface: true
  ood_can_zone:
    center:
    - -0.25
    - -0.25
    - 0.8
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style

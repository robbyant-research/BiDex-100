name: open_bottle_and_drop_two_sugar_cubes_in_bottle
language: With the left arm flip open the bottle's articulated cap, and with the right arm pick up the first and second sugar cubes and drop them into the bottle.
max_seconds: 51.56
max_steps: 1289
subtasks:
- name: Left arm flips open the bottle's articulated cap
  score: 10
- name: Right arm picks up the first sugar cube
  score: 10
- name: Right arm drops the first sugar cube into the bottle
  score: 15
- name: Right arm picks up the second sugar cube
  score: 10
- name: Right arm drops the second sugar cube into the bottle
  score: 15
- name: Extra sugar cube 1 never enters the bottle
  score: 10
- name: Extra sugar cube 2 never enters the bottle
  score: 10
- name: Extra sugar cube 1 is never picked up
  score: 10
- name: Extra sugar cube 2 is never picked up
  score: 10
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
regions:
  # All four sugar cubes share ONE spawn region with randomized x and y, so two
  # cubes may land at the same xy -> stacking is allowed (settled by physics).
  # The zone is shifted to the right-arm side (positive y); y in [0.0, +0.22]
  # so every cube is reachable by the right arm (which also has to reach the
  # bottle at y=0 to drop it in). Target / forbidden cubes are tracked by
  # object identity (SugarCube00N), not by position.
  sugar_zone:
    center:
    - 0.25
    - 0.11
    - 0.85
    xy_range:
    - 0.05
    - 0.11
    yaw_range:
    - -3.14
    - 3.14
    # Force the four cubes to spawn at distinct xy positions (>= 3.5 cm apart)
    # so they neither embed nor collide while falling -- each lands at its own
    # xy, no tumbling, no rolling off the table. (Distinct xy is the no-embed
    # guarantee here; z stays at the table spawn height.)
    min_distance: 0.035
objects:
- name: a_classic_occ_bottle_with_articulated_cap
  pos:
  - -0.1
  - 0.0
  - 0.98
  quat:
  - 1
  - 0
  - 0
  - 0
  scale: 0.65
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube001
  region: sugar_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube002
  region: sugar_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube003
  region: sugar_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube004
  region: sugar_zone
  scale: 2.8
  freejoint: true
fixtures: []
articulations:
- object: a_classic_occ_bottle_with_articulated_cap
  joint: cap_hinge
  qpos: 0.0
goal:
- type: open
  args:
  - a_classic_occ_bottle_with_articulated_cap
  - cap_hinge
  threshold: 1.26
  subtask: Left arm flips open the bottle's articulated cap
# This task drops TWO sugar cubes (the third and the fourth) into the bottle.
- type: lifted
  args:
  - rc/lightwheel/sugar_cube/SugarCube003
  subtask: Right arm picks up the first sugar cube
- type: in_bottle
  args:
  - rc/lightwheel/sugar_cube/SugarCube003
  - a_classic_occ_bottle_with_articulated_cap
  subtask: Right arm drops the first sugar cube into the bottle
  threshold: 0.13
  must_hold: true
- type: lifted
  args:
  - rc/lightwheel/sugar_cube/SugarCube004
  subtask: Right arm picks up the second sugar cube
- type: in_bottle
  args:
  - rc/lightwheel/sugar_cube/SugarCube004
  - a_classic_occ_bottle_with_articulated_cap
  subtask: Right arm drops the second sugar cube into the bottle
  threshold: 0.13
  must_hold: true
# Only the third and fourth cubes may enter the bottle; the other two (1, 2)
# must never be dropped in nor picked up. `in_bottle` resolves the bottle's
# live body xpos directly (no region/target) and counts a cube anywhere in the
# body height (origin-0.05 < cube_z < origin+0.20) within the xy footprint -- a
# cube perched on the mouth rim does NOT count. `not_in_bottle` / `not_lifted`
# use `latch_violation: true` (not must_hold): entering the bottle / being
# lifted is transient, so latch a PERMANENT failure the first frame it happens
# -- a forbidden cube dropped in then pulled out must NOT recover its green
# light.
- type: not_in_bottle
  args:
  - rc/lightwheel/sugar_cube/SugarCube001
  - a_classic_occ_bottle_with_articulated_cap
  subtask: Extra sugar cube 1 never enters the bottle
  threshold: 0.13
  latch_violation: true
- type: not_in_bottle
  args:
  - rc/lightwheel/sugar_cube/SugarCube002
  - a_classic_occ_bottle_with_articulated_cap
  subtask: Extra sugar cube 2 never enters the bottle
  threshold: 0.13
  latch_violation: true
- type: not_lifted
  args:
  - rc/lightwheel/sugar_cube/SugarCube001
  subtask: Extra sugar cube 1 is never picked up
  latch_violation: true
- type: not_lifted
  args:
  - rc/lightwheel/sugar_cube/SugarCube002
  subtask: Extra sugar cube 2 is never picked up
  latch_violation: true
obj_of_interest:
- a_classic_occ_bottle_with_articulated_cap
- rc/lightwheel/sugar_cube/SugarCube001
- rc/lightwheel/sugar_cube/SugarCube002
- rc/lightwheel/sugar_cube/SugarCube003
- rc/lightwheel/sugar_cube/SugarCube004

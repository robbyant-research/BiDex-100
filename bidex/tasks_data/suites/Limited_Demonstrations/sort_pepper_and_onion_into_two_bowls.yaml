name: sort_pepper_and_onion_into_two_bowls
language: Put one bell pepper into one bowl and one onion into the other, keeping each kind separate.
subtasks:
- name: Pick up the first bell pepper
  score: 25
- name: Place the first bell pepper into its bowl
  score: 25
- name: Pick up the first onion
  score: 25
- name: Place the first onion into its bowl
  score: 25
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# Every object is from a previously-UNTOUCHED category: bell_pepper_2/3 (0/1 are
# used elsewhere), onion_1/2 (onion_0 is used elsewhere), bowl_5 and bowl_7
# (free bowl instances). This is the TWO-CONTAINER SORT archetype (new vs the
# single-container put-into batch): two item TYPES must be separated into two
# DISTINCT containers. bowl_5 (peppers, ~11.5 cm) and bowl_7 (onions, ~13 cm)
# are heavy stations (freejoint + mass 200, rest_on_surface true, yaw pinned 0)
# on the -x side; the two ~7.6 x 10 cm bell peppers spawn in a +y row on the +x
# side and the two ~6.4 x 6.7 cm onions in a -y row.
#
# `inside_contact` (support contact) gates EACH placement: a pepper counts only
# when it has a SUPPORT contact with bowl_5's body subtree, an onion only with
# bowl_7 -- so a pepper dropped into bowl_7 (wrong bowl) reads RED for its
# pepper goal, and a vegetable on the TABLE reads RED for both. `must_hold:
# true` rejects anything that bounced out. Parallel (no ordering): each arm
# handles its own kind.
#
# Region boxes are disjoint (separation in x between bowls and veg, in y between
# the pepper row and the onion row): bowls at x[-0.25,-0.15] y +/-0.16 (xy 0.05);
# peppers at x[0.04,0.16] & x[0.18,0.30] on y=+0.20 (xy 0.06 -> 0.12 wide);
# onions at the same two x on y=-0.20. bowl-to-veg ~0.22 m clear in x; the two
# peppers are 0.14 m apart in x (0.02 m gap between 0.12-wide boxes); pepper row
# vs onion row 0.40 m apart in y; the two bowls 0.32 m apart in y (0.22 m gap).
regions:
  bowl5_zone:
    center:
    - -0.1
    - 0.16
    - 0.85
    xy_range:
    - 0.05
    - 0.05
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
  bowl7_zone:
    center:
    - -0.1
    - -0.16
    - 0.85
    xy_range:
    - 0.05
    - 0.05
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
  pep0_zone:
    center:
    - 0.10
    - 0.20
    - 0.85
    xy_range:
    - 0.06
    - 0.06
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  pep1_zone:
    center:
    - 0.24
    - 0.20
    - 0.85
    xy_range:
    - 0.06
    - 0.06
    yaw_range:
    - -3.14
    - 3.14

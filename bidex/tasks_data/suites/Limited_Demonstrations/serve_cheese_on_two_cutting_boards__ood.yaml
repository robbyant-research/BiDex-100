# OOD variant of tabletop_serve_cheese_on_two_cutting_boards (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + arm_mirror(5.4) + BAKED distractors.
# (Random 5.3 injection is DISABLED: injected plates/trays/spoons -- one Tray003
# spans 0.40 x 0.25 m -- repeatedly landed on top of the cutting boards. Two small
# objects are baked at x -0.28, clear of the boards (board x min ~-0.18).)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: serve_cheese_on_two_cutting_boards
language: Pick up a cheese block and set it flat on its cutting board, one cheese per board.
subtasks:
- name: Pick up the first cheese block
  score: 25
- name: Set the first cheese block on its cutting board
  score: 25
- name: Pick up the second cheese block
  score: 25
- name: Set the second cheese block on its cutting board
  score: 25
ood:
  base_task: tabletop_serve_cheese_on_two_cutting_boards
  scene_randomize: true
  baked_layout: true
  arm_mirror: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# Every object is from a previously-UNTOUCHED category: the objaverse `cheese`
# family (cheese_0, cheese_1) and `cutting_board` family (cutting_board_0,
# cutting_board_1) are both entirely new. A cutting board is a flat ~30 x 20 cm
# slab -- a heavy station (freejoint + mass 200, rest_on_surface true so its flat
# underside sits on the table, yaw pinned 0) that stays put while a cheese block
# is laid on it. The two cheese blocks spawn free-jointed on the +x side, one
# per arm, each to be lifted and set onto its paired board on the -x side.
#
# `supported_geom_in_region_band` requires the visible cheese bbox centre over the
# board's live `reg_bbox`, in the board-relative height band, with the board
# physically supporting it. This accepts a block that is mostly on the board
# near an edge while rejecting one supported by the table beside the board.
# `must_hold: true` rejects a cheese that slid back off the board by the final
# frame. This is a parallel two-arm task (no ordered_subtasks): each arm completes
# its own board independently.
#
# Region boxes are disjoint (separation in x between boards and cheeses,
# separation in y between the two boards / two cheeses): board zones at
# x[-0.10,0.00] y +/-0.17 (xy 0.05/0.02); cheese zones at x[0.15,0.29] y
# +/-0.16 (xy 0.07). board-to-cheese ~0.14 m clear in x; the two boards are
# 0.34 m apart in y centre (guaranteed >= 2 cm edge gap for the 0.28-m-long
# boards); the two cheeses likewise. Boards/cheeses never touch at spawn.
regions:
  # Each cutting board is physically 0.148 x 0.28 m (yaw pinned 0), so two
  # boards overlap unless their CENTRES are >= 0.28 m apart in y. The previous
  # OOD offsets (y centres +0.1385 / -0.1309 with +-0.05 jitter) let them come
  # within 0.169 m -> the boards spawned interpenetrating (overlap). Centres
  # pinned at y +/-0.17 with only +-0.02 y jitter: min centre gap 0.30 m ->
  # guaranteed >= 2 cm of daylight between the boards' edges.
  board0_zone:
    center:
    - -0.05
    - -0.17
    - 0.85
    xy_range:
    - 0.05
    - 0.02
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
  board1_zone:
    center:
    - -0.05
    - 0.17
    - 0.85
    xy_range:
    - 0.05
    - 0.02
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
  # Cheese zones keep the base centres (0.22, +/-0.16): the previous OOD
  # offsets (+/-0.13) let the two ~0.13-0.17 m cheese blocks' worst-case
  # rotated corners touch at spawn; at +/-0.16 the pair keeps the base's
  # clearance. x stays clear of the boards (board x max ~0.03).
  cheese0_zone:
    center:
    - 0.22
    - -0.16
    - 0.85
    xy_range:
    - 0.07
    - 0.07
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  cheese1_zone:
    center:
    - 0.22
    - 0.16
    - 0.85
    xy_range:
    - 0.07
    - 0.07
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  # Baked OOD distractors (far -x, clear of both boards: board x min ~-0.18):
  #   can:     x[-0.343,-0.217] y[-0.063,0.063]
  #   paprika: x[-0.339,-0.221] y[0.191,0.309] (mirrored)
  ood_can_zone:
    center:
    - -0.28
    - 0.0
    - 0.8
    xy_range:
    - 0.015
    - 0.015
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  ood_paprika_zone:
    center:
    - -0.28
    - 0.25
    - 0.8
    xy_range:
    - 0.015
    - 0.015
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
objects:
- name: rc/objaverse/cutting_board/cutting_board_0
  region: board0_zone

name: place_strainer_with_tomatoes_and_spoon_on_dish_rack
language: Pick up the strainer, put the two tomatoes into it, lift it onto the dish
  rack, then place the spoon onto the dish rack as well.
subtasks:
- name: Pick up the strainer
  score: 10
- name: Pick up the first tomato
  score: 10
- name: Place the first tomato into the strainer
  score: 10
- name: Pick up the second tomato
  score: 10
- name: Place the second tomato into the strainer
  score: 10
- name: Place the strainer onto the dish rack
  score: 15
- name: Pick up the spoon
  score: 15
- name: Place the spoon onto the dish rack
  score: 20
ood:
  base_task: tabletop_long_strainer_fruits_spoon_dish_rack
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 200
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
regions:

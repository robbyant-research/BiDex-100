# Every object is from a previously-UNTOUCHED category: dish_rack (DishRack001)
# and three canned_food tins (canned_food_0/1/3). The dish rack is a multi-tier
# wire rack (~49 x 30 cm unscaled), scaled DOWN to 0.5 (~24 x 15 cm) so it fits
# the table, free-jointed with mass 5 (heavy enough to stay put while cans are
# loaded, the same recipe `tabletop_insert_items_into_shelf` uses for its
# wooden_shelf), yaw pinned 0 to keep the long axis along world x. The three
# cans spawn on the +x side in a y-column. Region boxes are disjoint:
#   rack  x[-0.21,-0.15]  y[-0.03,0.03]   (xy 0.03)
#   cans  x[0.23,0.29]   y +/-{0.20,0.0,-0.20} (xy 0.03 -> 0.06 wide)
# rack-to-cans ~0.38 m clear in x; can boxes 0.20 m apart in y (0.14 m clear);
# the rack's ~7.5 cm (scaled) half-width in y stays clear of the cans at y=+/-0.20.
# `inside_contact` (not the xy-radius `inside`) is the robust gate for a
# multi-tier rack: a can counts as loaded only when it has a SUPPORT contact
# with the rack subtree -- a vertical-normal contact, i.e. a tier is beneath it
# holding it up -- which a can merely bumped against the rack's side wire while
# being carried past does NOT have. `must_hold:true` rejects a can that landed
# on a tier then tipped off onto the table (no support contact at the end).

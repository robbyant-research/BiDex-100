# OOD variant of kitchen_gather_condiments_on_tray (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: put_mustard_and_honey_bottle_on_tray
language: Put the mustard and the honey bottle on the tray.
subtasks:
- name: Pick up the mustard
  score: 25
- name: Place the mustard on the tray
  score: 25
- name: Place the honey bottle on the tray
  score: 50
ood:
  base_task: kitchen_gather_condiments_on_tray
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 4
robot_type: astribot_s1_fixed_sharpa
scene: dexjoco_table_arena
robot_pose:
  pos:
  - 0.8
  - 0.0
  - 0.0
  quat:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
regions:
  # The previous OOD shifted every zone -0.06 in x (grasped items' spawn x down
  # to 0.15, at/over the edge of the arms' workspace). Kitchen OOD keeps
  # grasped-object zones at the ID centres with only a slightly WIDER range
  # than ID (x 0.09->0.11; y kept 0.09 for the pair separation). The long tray
  # stays in its own +x band with limited jitter/yaw, leaving a physical gap from
  # both bottles while keeping its complete footprint on the tabletop.
  mustard_zone:
    center:
    - 0.3
    - -0.15
    - 0.8775
    xy_range:
    - 0.11
    - 0.09
    yaw_range:
    - -3.14
    - 3.14
  honey_bottle_zone:
    center:
    - 0.3
    - 0.15
    - 0.8775
    xy_range:
    - 0.11
    - 0.09
    yaw_range:
    - -3.14
    - 3.14
  tray_zone:
    center:
    - 0.56
    - 0.0
    - 0.8775
    xy_range:
    - 0.01
    - 0.06
    yaw_range:
    - -0.1
    - 0.1
objects:
- name: mustard
  region: mustard_zone
- name: honey_bottle
  region: honey_bottle_zone
- name: tray
  region: tray_zone
fixtures: []
goal:
# Partial overhang counts when the tray still physically supports the object.
# Adjacent table support and hovering above the tray do not count.
- type: lifted
  args:
  - mustard
  subtask: Pick up the mustard
- type: inside_contact
  args:
  - mustard
  - tray
  subtask: Place the mustard on the tray
  must_hold: true
- type: inside_contact
  args:
  - honey_bottle
  - tray
  subtask: Place the honey bottle on the tray
  must_hold: true
obj_of_interest:
- mustard
- honey_bottle
- tray

# OOD variant of kitchen_set_condiment_tray (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: place_condiments_on_tray
language: Place the salt and pepper shaker, mustard, and bbq sauce on the tray.
subtasks:
- name: Pick up the salt and pepper shaker
  score: 20
- name: Place the salt and pepper shaker on the tray
  score: 20
- name: Place the mustard on the tray
  score: 30
- name: Place the bbq sauce on the tray
  score: 30
ood:
  base_task: kitchen_set_condiment_tray
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 4
robot_type: astribot_s1_fixed_sharpa
scene: dexjoco_table_arena
robot_pose:
  pos:
  - 0.8
  - 0.0
  - 0.0
  quat:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
regions:
  # The previous OOD pushed the grasped condiments toward the table's far edge
  # (mustard spawn x down to 0.114, shaker to 0.154) -- at/beyond the arms'
  # workspace. Kitchen-OOD rule: grasped items stay at the ID centres with a
  # slightly WIDER range than ID (y 0.06->0.08 for the two front items, x
  # 0.06->0.08 for the bbq sauce); x ranges are kept at ID for the front pair
  # so the shaker/mustard keep their ID clearance to the tray.
  salt_and_pepper_shaker_zone:
    center:
    - 0.25
    - -0.15
    - 0.8775
    xy_range:
    - 0.06
    - 0.08
    yaw_range:
    - -3.14
    - 3.14
  mustard_zone:
    center:
    - 0.25
    - 0.15
    - 0.8775
    xy_range:
    - 0.06
    - 0.08
    yaw_range:
    - -3.14
    - 3.14
  bbq_sauce_zone:
    center:
    - 0.55
    - -0.15
    - 0.8775
    xy_range:
    - 0.08
    - 0.06
    yaw_range:
    - -3.14
    - 3.14
  tray_zone:
    center:
    - 0.55
    - 0.15
    - 0.8775
    xy_range:
    - 0.06
    - 0.06
    yaw_range:
    - -3.14
    - 3.14
objects:
- name: salt_and_pepper_shaker
  region: salt_and_pepper_shaker_zone
- name: mustard
  region: mustard_zone
- name: bbq_sauce
  region: bbq_sauce_zone
- name: tray
  region: tray_zone
fixtures: []
goal:
- type: lifted
  args:
  - salt_and_pepper_shaker
  subtask: Pick up the salt and pepper shaker
# inside_box (NOT circular `on`): the tray is a long rectangular slab (~0.13 x
# 0.22 m footprint); the old `on` radius 0.08 was too tight, so a bottle at the
# tray edge (or tilted/reclined toward the end) read off -- and a tilted mustard
# placed in the tray was missed. inside_box uses the tray's own box footprint
# (x/y half-extents + 0.02 margin), so any bottle resting anywhere on the tray
# (upright OR tilted) latches, and one off the tray does not. must_hold keeps it
# on the tray at the final frame.
- type: inside_box
  args:
  - salt_and_pepper_shaker
  - tray
  threshold: 0.02
  subtask: Place the salt and pepper shaker on the tray
  must_hold: true
- type: inside_box
  args:
  - mustard
  - tray
  threshold: 0.02
  subtask: Place the mustard on the tray
  must_hold: true
- type: inside_box
  args:
  - bbq_sauce
  - tray
  threshold: 0.02
  subtask: Place the bbq sauce on the tray
  must_hold: true
obj_of_interest:
- salt_and_pepper_shaker
- mustard
- bbq_sauce
- tray

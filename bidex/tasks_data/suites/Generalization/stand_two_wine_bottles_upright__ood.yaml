# OOD variant of tabletop_stand_two_wine_bottles_upright (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + arm_mirror(5.4) + baked distractors.
# (Random 5.3 injection is DISABLED -- injected glass cups / beer mugs / a fruit
# bowl repeatedly spawned on top of the two lying wine bottles. A transparent
# glass cup (top-left) and a beer mug (bottom-left) are baked instead, far clear
# of the bottles' extended lying footprints; wine_3's yaw range is back to the ID
# task's [2.7,3.3] so the second bottle points the same way as in ID.)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: stand_two_wine_bottles_upright
language: Pick up the two wine bottles lying on their sides and stand them upright on the table.
subtasks:
- name: Pick up the first wine bottle
  score: 25
- name: Stand the first wine bottle upright
  score: 25
- name: Pick up the second wine bottle
  score: 25
- name: Stand the second wine bottle upright
  score: 25
ood:
  base_task: tabletop_stand_two_wine_bottles_upright
  scene_randomize: true
  baked_layout: true
  arm_mirror: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# Two free `wine` instances (wine_2 / wine_3) from the previously-UNTOUCHED
# `wine` family. A wine bottle is a tall slim cylinder (reg_bbox half 0.018 x
# 0.019 x 0.095; scale 1.5 -> half-length 0.1425 m, ~28.5 cm tall x 5.7 cm
# wide). Each spawns LYING ON ITS SIDE via `spawn_quat` (90 deg about x lays the
# bottle's long/local-z axis horizontal) with a random yaw, free-jointed so it
# settles stably on its cylindrical body. This is the UPRIGHT archetype: the
# bottles start tipped over and must be stood up. (Was a three-bottle task; the
# third bottle -- wine_4 -- was removed and the task renamed.)
#
# `upright(bottle, 0.6)` is the gate -- it reads the body xmat and checks the
# bottle's local z-axis points within 0.6 (~53 deg) of world up. A bottle lying
# on its side has local-z horizontal -> dot ~ 0 < 0.6 -> RED at spawn; a bottle
# stood on its base has local-z up -> dot ~ 1 > 0.6 -> GREEN. `lifted` precedes
# each stand so the subtask latches only once the bottle is actually handled.
# `must_hold: true` rejects a bottle that fell back over by the final frame.
#
# The TWO bottle spawn regions are random but never overlap. Each bottle lies on
# its side (spawn_quat), so its footprint reaches ~its half-length (0.171 m at
# scale 1.8) from its centre along the (random yaw) long axis. The mirrored
# (0,-0.18) / (0.18,0.18) centres put the two lying bodies on the SAME y-column
# tip-to-tip; at extreme jitter their tips could graze. b0 therefore sits at
# (-0.10,-0.19) with tightened xy (0.05,0.03): its worst-case x reach (~0.033)
# stays left of b1's zone column (x min ~0.079), so the two are x-separated for
# ANY draw, and nominal centre separation is sqrt(0.28^2+0.37^2) = 0.46 m. Both
# stay on the table (max extent 0.10 + 0.05 + 0.171 < 0.40 m half-width).
ordered_subtasks: true
regions:
  bottle0_zone:
    center:
    - -0.1
    - -0.19
    - 0.87
    # Moved to (-0.10,-0.19) with tighter xy jitter so its worst-case reach
    # (x max ~0.033 + width) can never overlap bottle1's zone column (x min
    # ~0.079): the mirrored (0,-0.18) layout put the two lying bottles on the
    # same y-column tip-to-tip, letting their extremes graze at spawn.
    xy_range:
    - 0.05
    - 0.03
    yaw_range:
    - -0.3
    - 0.3
  bottle1_zone:
    center:
    - 0.18
    - 0.18
    - 0.87
    xy_range:
    - 0.08
    - 0.05
    # Same world yaw range as the ID task ([2.7,3.3]) so the second bottle's
    # resting direction matches ID (the y-mirror had flipped it to [-3.3,-2.7]).
    yaw_range:
    - 2.7
    - 3.3
  # Baked OOD distractors, disjoint from each other and from the lying bottles
  # (wine_2 sweeps x[-0.16,0.16] at y~-0.18; wine_3 sweeps x[0.0,0.36] at
  # y~0.18 -- both may reach 0.17 m from their centre along the body):
  #   glass: x[-0.342,-0.218] y[0.158,0.282]  (top-left, yaw pinned 0)
  #   mug:   x[-0.345,-0.205] y[-0.256,-0.144] (bottom-left, clear of wine_2)
  ood_glass_zone:
    center:
    - -0.28
    - 0.22
    - 0.8
    xy_range:
    - 0.015
    - 0.015
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
  ood_mug_zone:
    center:
    - -0.275
    - -0.2
    - 0.8
    xy_range:
    - 0.008
    - 0.01
    yaw_range:
    - 1.4
    - 1.75
    rest_on_surface: true
objects:
- name: rc/objaverse/wine/wine_2
  region: bottle0_zone
  scale: 1.8
  freejoint: true
  spawn_quat:
  - 0.7071

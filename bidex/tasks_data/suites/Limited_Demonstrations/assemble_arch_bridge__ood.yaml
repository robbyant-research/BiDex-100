# OOD variant of assemble_arch_bridge (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: assemble_arch_bridge
language: Stand two piers on the base, lay the deck across them, then set the capstone cube on the middle of the deck.
subtasks:
- name: Stand pier A on the base
  score: 10
- name: Stand pier B on the base
  score: 10
- name: Pick up the deck
  score: 20
- name: Lay the deck across the two piers
  score: 20
- name: Pick up the capstone
  score: 20
- name: Set the capstone on the deck centre
  score: 20
ood:
  base_task: assemble_arch_bridge
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 4
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 260
robot_pose:
  pos: [0.5, -0.45, 0.6]
  quat: [0.382683, 0, 0, 0.92388]
shuffle_regions:
- pier_a
- pier_b
- assembly_bridge_deck
- cube_a
# ordered_subtasks: true
# ASSEMBLY (arch bridge, scale 1.25). Two piers stand 8 cm apart on the
# base; the 15 cm deck spans the gap with a cantilever each side; a cube capstone
# centres on the deck. ordered_subtasks forces pier_a -> pier_b -> deck ->
# capstone. inside_contact grades each tier (z_min = tier resting surface: base
# top 0.8125, pier tops 0.85, deck top 0.8875). pier_a/pier_b are block_short
# aliases; cube_a is the assembly_cube alias. Regions centred on the table
# (fixture near x=0, parts x=0.225 +/-0.04). Four y bands are 0.16 m
# apart with +/-0.015 m jitter, so their minimum centre separation is 0.13 m.
# shuffle_regions permutes which part occupies each band per episode. The
# closest deck envelope remains 1.8 cm clear of the base and every band remains
# inside the table. Each part is lifted then placed, must_hold.
regions:
  fixture_zone:
    center: [0.0, 0.0, 0.80]
    xy_range: [0.0, 0.01]
    yaw_range: [0.0, 0.01]
    rest_on_surface: true
  part_a_zone: &part_a
    center: [0.225, -0.24, 0.8]
    xy_range: [0.04, 0.015]
    yaw_range: [-3.14, 3.14]
    rest_on_surface: true
  part_b_zone:
    <<: *part_a
    center: [0.225, -0.08, 0.8]
  part_c_zone:
    <<: *part_a
    center: [0.225, 0.08, 0.8]
  part_d_zone:
    <<: *part_a
    center: [0.225, 0.24, 0.8]
objects:
- name: assembly_base
  region: fixture_zone
  freejoint: false
  scale: 1.25
- name: pier_a
  region: part_a_zone
  scale: 1.25
  freejoint: true
- name: pier_b
  region: part_b_zone
  scale: 1.25
  freejoint: true
- name: assembly_bridge_deck
  region: part_c_zone
  scale: 1.25
  freejoint: true
- name: cube_a
  region: part_d_zone
  scale: 1.25
  freejoint: true
fixtures: []
goal:
- type: lifted
  args: [pier_a]
  subtask: Stand pier A on the base
  threshold: 0.83
- type: inside_contact
  args: [pier_a, assembly_base]
  threshold: 0.805
  subtask: Stand pier A on the base
  must_hold: true
- type: lifted
  args: [pier_b]
  subtask: Stand pier B on the base
  threshold: 0.83
- type: inside_contact
  args: [pier_b, assembly_base]
  threshold: 0.805
  subtask: Stand pier B on the base
  must_hold: true
- type: lifted
  args: [assembly_bridge_deck]
  subtask: Pick up the deck
  threshold: 0.85
- type: inside_contact
  args: [assembly_bridge_deck, pier_a]
  threshold: 0.85
  subtask: Lay the deck across the two piers
  must_hold: true
- type: lifted
  args: [cube_a]
  subtask: Pick up the capstone
  threshold: 0.85
- type: inside_contact
  args: [cube_a, assembly_bridge_deck]
  threshold: 0.8875
  subtask: Set the capstone on the deck centre
  must_hold: true
obj_of_interest:
- assembly_base
- pier_a
- pier_b
- assembly_bridge_deck
- cube_a

# ranges widened by widen_ood_ranges.py (k=1.045, mode=all, uniform-k, distractors=none)
# OOD variant of tabletop_touch_press_buttons (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: press_red_button_then_blue_button
language: With the left arm press the red button exactly ten times, and only then, with the right arm press the blue button once.
subtasks:
- name: Left arm presses the red button exactly ten times
  score: 50
- name: Right arm presses the blue button once
  score: 50
ood:
  base_task: tabletop_touch_press_buttons
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
regions:
  # Two spring push-buttons (bell-style), one per arm workspace, placed at a
  # RANDOM position each episode -- mirroring the bowl placement in
  # tabletop_swap_fruits: one zone per y hemisphere, centres 0.30 m apart so the
  # two never overlap, generous x spread, tight y spread, small yaw jitter. The
  # base is mocap (`freejoint: false` adds no freejoint; mocap=true in the XML)
  # so it is kinematic -- it can never roll, tip, or be knocked away. Each
  # reset, env._reset_button_state samples each button's mocap base from its
  # zone via the SAME RegionSampler that places the bowls (xy_range + yaw_range),
  # giving per-episode placement variety identical in spirit to the bowls. The
  # cap slides down under a finger and springs back; env._apply_button_interaction
  # counts distinct presses (hysteresis on the cap's slide qpos) into
  # ObjectInit.press_count, which the `pressed_exact` / `pressed_after`
  # predicates read. Red on the left (negative y), blue on the right (positive
  # y). z=0.80 sits the base on the table (tabletop z=0.80); the zone centres
  # anchor the per-episode jitter.
  red_button_zone:
    center:
    - 0.15
    - -0.15
    - 0.8
    xy_range:
    - 0.1045
    - 0.0418
    yaw_range:
    - -0.3
    - 0.3
  blue_button_zone:
    center:
    - 0.15
    - 0.15
    - 0.8
    xy_range:
    - 0.1045
    - 0.0418
    yaw_range:
    - -0.3
    - 0.3
objects:
- name: dexjoco_button_red
  region: red_button_zone
  # Anchor used only when randomize_buttons is False (the per-episode sampled
  # pose from red_button_zone wins otherwise). Matches the zone centre.
  pos:
  - 0.15
  - -0.15
  - 0.8
  quat:
  - 1
  - 0
  - 0
  - 0
  scale: 1
  freejoint: false
  button: true
- name: dexjoco_button_blue
  region: blue_button_zone
  pos:
  - 0.15
  - 0.15
  - 0.8
  quat:
  - 1
  - 0
  - 0
  - 0
  scale: 1
  freejoint: false
  button: true
fixtures: []
goal:
# Strict, exact-count contract:
#   * Red must be pressed EXACTLY 10 times -- 9 (too few) or 11 (too many) both
#     fail. `pressed_exact` is True only while press_count == 10; `must_hold`
#     then requires that to STILL hold at the final frame, so an 11th press
#     makes holds_now False -> fail, while stopping at 9 never latches done.
#   * Blue must be pressed EXACTLY once AND only AFTER red has reached 10 --
#     `pressed_after` checks press_count == 1 AND (via the env-populated
#     per-press snapshot log) that the blue press fired while red.press_count
#     was already >= 10. A blue press before red is done, or a 2nd blue press,
#     is a permanent failure (must_hold enforces the exact count at the end).
# Each button owns its own subtask so SubtaskTracker latches them independently.
- type: pressed_exact
  args:
  - dexjoco_button_red
  - 10
  subtask: Left arm presses the red button exactly ten times
  must_hold: true
- type: pressed_after
  args:
  - dexjoco_button_blue
  - 1
  - dexjoco_button_red
  - 10
  subtask: Right arm presses the blue button once
  must_hold: true
obj_of_interest:
- dexjoco_button_red
- dexjoco_button_blue

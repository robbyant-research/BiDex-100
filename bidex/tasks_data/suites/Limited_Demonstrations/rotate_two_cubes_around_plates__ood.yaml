# OOD variant of tabletop_memory_rotate_two_cubes (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: rotate_two_cubes_around_plates
language: Move the two cubes clockwise around the three triangle plates one move at a time, always moving the cube before the empty plate onto it, until each returns to its start.
subtasks:
- name: Move 1 - right arm moves cube B onto the empty plate
  score: 17
- name: Move 2 - left arm moves cube A onto the vacated plate
  score: 17
- name: Move 3 - right arm moves cube B clockwise again
  score: 16
- name: Move 4 - left arm moves cube A clockwise again
  score: 17
- name: Move 5 - right arm returns cube B to its start
  score: 16
- name: Move 6 - left arm returns cube A to its start
  score: 17
- name: The plate that started empty is empty again
  score: 0
ood:
  base_task: tabletop_memory_rotate_two_cubes
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# MEMORY task: two identical cubes cycling around three identical plates on an
# equilateral triangle, one full clockwise circle (6 moves), ending exactly
# where they started (same choreography as the retired balls-and-bowls
# version). The scene repeats THREE times per episode in visually
# indistinguishable form: after 3 moves the OCCUPANCY pattern is already
# restored (the same plate is empty and both cubes are back on their starting
# vertices -- but swapped, which identical cubes hide), and after 6 moves the
# instances are restored too. The model can only know whether the circle is
# complete by counting its own moves; the goals grade the full 6-move
# instance-level choreography.
#
# STATIONS: three assembly_base plates (14 x 14 x 1 cm, origin at the plate
# bottom) via the base_a / base_b / base_c symlink aliases -- distinct catalog
# names so the goals can grade each plate, identical looks so the layout
# carries the memory load. CUBES: cube_a / cube_b (aliases of the 4 cm
# assembly_cube, both red, visually identical).
#
# GEOMETRY (robot front = -x: left = -y, right = +y, near = +x, far = -x).
# Circumradius 0.16 m (edge 0.277 m -- plates leave 0.137 m gaps), centroid
# jittered per episode; clockwise vertex order seen by the robot:
# far (-0.16, 0) -> right (+0.08, +0.1386) -> left (+0.08, -0.1386).
#
# RIGID TRIANGLE: an invisible collisionless assembly_anchor puck (obj1) is the
# only object with a jittered region; the three plates spawn at PINNED vertex
# offsets relative to its live root (target obj1_root), so the whole triangle
# translates per episode without deforming (target-relative spawn composes
# positions only, not yaw -- a fixed-orientation "standard" triangle is what
# we want). The plates (obj2/3/4) are freejoint mass 200: jittered with the
# anchor per episode, immovable during it.
#
# RANDOM OCCUPANCY: shuffle_regions + shuffle_mode cyclic permutes the three
# PLATE instances among the three vertex zones each episode (3 cyclic shifts,
# preserving the a->b->c clockwise cycle). Cubes always spawn on instance
# plates base_a (obj2) and base_b (obj3) via their target-relative zones, so
# base_c is always the empty INSTANCE -- but the empty VERTEX is random
# (left / far / right), which is all the model can see (plates identical).
# The cyclic restriction keeps the fixed instance choreography below ALWAYS
# clockwise in the world frame; a full permutation would reverse the instance
# cycle in half the episodes.
#
# CHOREOGRAPHY (instance-level, valid under every cyclic shift; each move is
# "the cube clockwise-before the empty plate moves onto it"; arms alternate,
# right arm first):
#   1 right: cube_b base_b -> base_c      4 left:  cube_a base_b -> base_c
#   2 left:  cube_a base_a -> base_b      5 right: cube_b base_a -> base_b
#   3 right: cube_b base_c -> base_a      6 left:  cube_a base_c -> base_a
# After move 3 the occupancy pattern is restored with the cubes swapped (the
# memory trap); move 6 restores the instances. Final must_hold: cube_a@base_a,
# cube_b@base_b, and base_c empty (not_inside for both cubes). ordered_subtasks
# is required: restored steps 5-6 and both not_inside finals are already true at spawn.
#
# `inside_contact(cube, plate)` requires the target plate to physically support
# the cube from below. It rejects zero-contact hovers and nearby table support.
# Cube spawn: plate root + 0.033 = 3 mm above the plate top, 2 cm xy jitter.
# `not_inside(cube, plate, 0.08)` reuses the inside semantics (xy radius + the
# +/-0.25 m z window), which works for the flat plates: a cube on the plate is
# ~3 cm above the plate root, well inside the window.
# Region boxes (anchor jitter only; plates pinned to vertices):
#   anchor x[-0.03,0.07] y[-0.04,0.04] -> triangle spans x[-0.26,0.22]
ordered_subtasks: true
shuffle_regions:
- base_a
- base_b
- base_c
shuffle_mode: cyclic
regions:
  anchor_zone:
    center:
    - 0.05
    - 0.0483
    - 0.8
    xy_range:
    - 0.05
    - 0.04
    yaw_range:
    - 0.0
    - 0.01
  # Triangle vertices relative to the anchor (clockwise: far -> right -> left).
  # Plate origin is at the plate bottom; z offset 0.002 above the anchor's
  # table weld (0.80) spawns each plate 2 mm over the tabletop to settle
  # without a bounce. Pinned xy keeps the triangle standard.
  far_vertex_zone:
    target: obj1_root
    center:
    - -0.16
    - 0.0
    - 0.002
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.0
  right_vertex_zone:
    target: obj1_root
    center:
    - 0.08
    - 0.1386
    - 0.002
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.0
  left_vertex_zone:
    target: obj1_root
    center:
    - 0.08
    - -0.1386
    - 0.002
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.0
  # Cubes drop onto their instance plate's top (plate top at root + 0.01, cube
  # half-height 0.02), 3 mm drop, no matter which vertex the plate was
  # shuffled to.
  cube_a_zone:
    target: obj2_root
    center:
    - 0.0
    - 0.0
    - 0.033
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
  cube_b_zone:
    target: obj3_root
    center:
    - 0.0
    - 0.0
    - 0.033
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
objects:
- name: assembly_anchor
  region: anchor_zone
  freejoint: false
- name: base_a
  region: far_vertex_zone
  mass: 200.0
- name: base_b
  region: right_vertex_zone
  mass: 200.0
- name: base_c
  region: left_vertex_zone
  mass: 200.0
- name: cube_a
  region: cube_a_zone
- name: cube_b
  region: cube_b_zone
fixtures: []
goal:
# Moves 1-3 (first half-circle): transient milestones, no must_hold -- the
# cubes leave these plates again in the second half.
- type: inside_contact
  args:
  - cube_b
  - base_c
  subtask: Move 1 - right arm moves cube B onto the empty plate
- type: inside_contact
  args:
  - cube_a
  - base_b
  subtask: Move 2 - left arm moves cube A onto the vacated plate
- type: inside_contact
  args:
  - cube_b
  - base_a
  subtask: Move 3 - right arm moves cube B clockwise again
# Moves 4-6 (second half-circle back to the spawn configuration).
- type: inside_contact
  args:
  - cube_a
  - base_c
  subtask: Move 4 - left arm moves cube A clockwise again
- type: inside_contact
  args:
  - cube_b
  - base_b
  subtask: Move 5 - right arm returns cube B to its start
  must_hold: true
# Restored = spawn config; all four must HOLD at the final frame.
- type: inside_contact
  args:
  - cube_a
  - base_a
  subtask: Move 6 - left arm returns cube A to its start
  must_hold: true
- type: not_inside
  args:
  - cube_a
  - base_c
  subtask: The plate that started empty is empty again
  threshold: 0.081
  must_hold: true
- type: not_inside
  args:
  - cube_b
  - base_c
  subtask: The plate that started empty is empty again
  threshold: 0.081
  must_hold: true
obj_of_interest:
- base_a
- base_b
- base_c
- cube_a
- cube_b

# Grab two spoons from the tray and drop them, one each, into two cups (one spoon
# per arm). The oven_tray is a freejoint mass-200 STATION (rest_on_surface ->
# settles on the table, no embed, stays put). The tray is ROTATED 90 DEG (yaw
# pinned pi/2): its 0.40 m long EDGE now runs along world y, its 0.25 m short
# edge along world x. The two spoons keep their NATURAL direction (long axis
# local y -> world y at yaw ~0 / ~pi) -- they are only TRANSLATED, not rotated,
# to the two ends of the tray's long edge: spoon_22 at +y (y=+0.10) and spoon_23
# at -y (y=-0.10). A spoon's half-length is 0.09 m, so each spans y[+0.01,+0.19]
# / y[-0.19,-0.01] -> a 0.02 m gap between them (no overlap) and both sit fully
# on the tray (0.19 < 0.202 m tray y-half). (At only y=+/-0.08 the lying spoons
# would overlap by ~0.02 m, hence the +/-0.10 offset.) Each spoon zone targets
# the tray's live root (obj1_root) with rest_on_surface so the spoon base sits
# above the tray (no tray penetration). The two mugs sit on the +x side 24 cm
# apart in y; the rotated tray stays clear of them (tray world x[-0.17,0.07] vs
# mugs at x=0.22). `inside_contact` gates "in the mug" (a support contact with
# the mug body, not just leaning on it).
name: drop_two_spoons_from_tray_into_two_cups
language: With each arm pick up a spoon from the tray and drop it, one each, into the two cups.
subtasks:
- name: Drop the first spoon into a cup
  score: 50
- name: Drop the second spoon into a cup
  score: 50

# OOD variant of tabletop_take_milk_from_microwave (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + baked distractor.
# (Random 5.3 injection is DISABLED: it repeatedly placed a big digital scale and
# a bottle on the -y side in front of the microwave / inside the milk drop zone.
# The only new object is a honey bottle on the +y side, clear of the microwave's
# right edge and of the milk drop zone (0.2532,-0.2068).)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: take_milk_from_microwave
language: Open the microwave, take out the milk, place it on the table, and close the microwave.
subtasks:
- name: Open the microwave door
  score: 40
- name: Pick up the milk
  score: 30
- name: Place the milk on the table
  score: 30
ood:
  base_task: tabletop_take_milk_from_microwave
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0.0
  - 0.0
  - 0.92388
regions:
  microwave_zone:
    center:
    - -0.1
    - -0.0365
    - 0.8
    xy_range:
    - 0.12
    - 0.12
    yaw_range:
    - 1.57
    - 2.0
  milk_zone:
    # Milk spawns INSIDE the microwave cavity, body-relative to the microwave
    # (obj1_object) so it tracks the cabinet's per-episode xy jitter. Center is
    # the cavity-floor rest point in the microwave body frame: xy = (0,0) is the
    # body-origin projection, which the cavity surrounds for ANY door yaw
    # (yaw_range 1.57..2.0), so the milk stays inside the cavity without the
    # sampler having to compose the cabinet's orientation. z = 0.091 puts the
    # milk's collision-box bottom on the cavity floor (body_z 0.8 + 0.036 floor
    # + 0.055 milk half-height), so it rests instead of dropping. xy_range is
    # kept tiny (0.02) so the milk can't reach a wall. (The prior world-frame
    # center (-0.1,-0.1,0.98) + 0.06 range + the microwave's +-0.12 jitter / yaw
    # routinely planted the milk 5-13 cm into a wall/door -> tunneling & fly-off.)
    target: obj1_object
    center:
    - 0.0
    - 0.0
    - 0.091
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -0.1
    - 0.1
  table_drop_zone:
    center:
    - 0.2532
    - -0.2068
    - 0.85
    xy_range:
    - 0.12
    - 0.12
  # Baked OOD distractor (+y side, as the digital-scale bug was fixed by
  # removing the scale). Honey bottle at scale 0.7 (hx~0.035): box
  # x[0.255,0.345] y[0.218,0.302]. The microwave's world +x reach is at most
  # ~0.248 (its 0.52 m local-x axis points along world y for yaw ~1.57-2.0), so
  # the bottle is strictly x-clear of it, and fully above the milk drop zone
  # (y max -0.087). Small jitter keeps it off the table edge.
  ood_bottle_zone:
    center:
    - 0.3
    - 0.26
    - 0.8
    xy_range:
    - 0.01
    - 0.015
    yaw_range:
    - -0.3
    - 0.3
    rest_on_surface: true
objects:
- name: microwave
  region: microwave_zone
  scale: 1.5
  freejoint: true
- name: milk
  region: milk_zone
  freejoint: true
- name: honey_bottle
  region: ood_bottle_zone
  scale: 0.7
  freejoint: true
fixtures: []
articulations:
- object: microwave
  joint: microjoint
  qpos: closed
goal:
- type: open
  args:
  - microwave
  - microjoint
  subtask: Open the microwave door
- type: lifted
  args:
  - milk
  subtask: Pick up the milk
- type: 'on'
  args:
  - milk
  - table_drop_zone
  threshold: 0.25
  subtask: Place the milk on the table
obj_of_interest:
- microwave
- milk

# OOD variant of tabletop_memory_open_red_cup (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: uncover_red_cube
language: Press the yellow button once to lift only the cover concealing the red cube.
subtasks:
- name: Right arm presses the yellow button exactly once, the caps appear
  score: 20
- name: All three cubes are covered by the caps
  score: 0
- name: Lift only the cap covering the red cube
  score: 80
- name: Green cube still covered at the end
  score: 0
- name: Blue cube still covered at the end
  score: 0
ood:
  base_task: tabletop_memory_open_red_cup
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# MEMORY task: caps appear on the button press and hide the cubes; reveal ONLY
# the red one. The three cubes shuffle their slot assignment every episode
# (shuffle_regions full permutation over three pinned slots), and the three
# caps are identical grey squares -- so after the press the scene is just
# three matching caps in a row and the model can only know which cap hides
# the RED cube by remembering the spawn layout it saw at frame 0. There are NO
# caps in the initial scene: the three assembly_cap covers (`reveal: true`)
# are parked below the floor at reset (they free-fall invisibly in the void)
# and the env teleports them onto the cubes the tick the button's press_count
# crosses 1 (env._apply_reveal_on_press); afterwards they are normal free
# bodies the robot can lift. The cover milestone is graded with the
# container-OR `inside_any(cube, cap_a, cap_b, cap_c)` because the reveal
# teleports each cap to a slot regardless of which color shuffled there.
# `inside` uses a +/-0.25 m z window, so a cap still falling far below the
# floor never reads as "covering" before the press.
# CAP: assembly_cap is a square cover purpose-built for the 4 cm cube -- 5.8 x
# 5.8 cm outer, 5.0 x 5.0 cm cavity, closed top, 5 mm per-side clearance; any
# yaw alignment fits (cube edge 4.0 < inner edge 5.0, cube diagonal 5.66 <
# inner diagonal 7.07), and both cube slots and cap reveal regions pin yaw to
# ~0 so the teleport lands square.
# LAYOUT (x axis, near +x -> far -x): the yellow button stands alone on the
# near side (x +0.22); the three cube slots form a row along y near the MIDDLE of
# the table (x -0.05 +/- anchor jitter, y -0.16 / 0 / +0.16). All slots are pinned offsets from an
# invisible collisionless assembly_anchor puck (obj1) whose jittered region
# translates the formation RIGIDLY per episode; the button jitters in its own
# zone. Cubes (red cube_a, green cube_grn_a, blue cube_blu_a) spawn 2 mm above
# the table on their (shuffled) slots.
# Region boxes (anchor jitter only; slots pinned):
#   anchor x[-0.03,0.07] y[-0.04,0.04] -> cube row spans x[-0.12,0.02]
ordered_subtasks: true
shuffle_regions:
- cube_a
- cube_grn_a
- cube_blu_a
regions:
  anchor_zone:
    center:
    - 0.02
    - 0.0301
    - 0.8
    xy_range:
    - 0.05
    - 0.04
    yaw_range:
    - 0.0
    - 0.01
  slot_1_zone:
    target: obj1_root
    center:
    - -0.05
    - -0.16
    - 0.022
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.01
  slot_2_zone:
    target: obj1_root
    center:
    - -0.05
    - 0.0
    - 0.022
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.01
  slot_3_zone:
    target: obj1_root
    center:
    - -0.05
    - 0.16
    - 0.022
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.01
  # Cap REVEAL regions: the teleport targets, one per slot (cap origin at the
  # rim bottom, 2 mm over the tabletop, yaw pinned to match the cubes).
  cap_1_zone:
    target: obj1_root
    center:
    - -0.05
    - -0.16
    - 0.002
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.01
  cap_2_zone:
    target: obj1_root
    center:
    - -0.05
    - 0.0
    - 0.002
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.01
  cap_3_zone:
    target: obj1_root
    center:
    - -0.05
    - 0.16
    - 0.002
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - 0.0
    - 0.01
  yellow_button_zone:
    center:
    - 0.22
    - 0.0
    - 0.8
    xy_range:
    - 0.04
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
objects:
- name: assembly_anchor
  region: anchor_zone
  freejoint: false
- name: cube_a
  region: slot_1_zone
- name: cube_grn_a
  region: slot_2_zone
- name: cube_blu_a
  region: slot_3_zone
# The three caps: `reveal: true` parks them at their explicit pos (below the
# floor, invisible) at reset; the env teleports them to their region-sampled
# pose (the matching slot) on the first button press.
- name: cap_a
  region: cap_1_zone
  pos:
  - -0.05
  - -0.16
  - -0.5
  quat:
  - 1
  - 0
  - 0
  - 0
  reveal: true
- name: cap_b
  region: cap_2_zone
  pos:

# OOD variant of kitchen_put_hotdog_bun_on_tray (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: put_hotdog_bun_on_tray
language: Pick up the hotdog bun and place it on the tray.
subtasks:
- name: Pick up the hotdog_bun
  score: 50
- name: Place the hotdog_bun on the tray
  score: 50
ood:
  base_task: kitchen_put_hotdog_bun_on_tray
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 5
robot_type: astribot_s1_fixed_sharpa
scene: dexjoco_table_arena
robot_pose:
  pos:
  - 0.8
  - 0.0
  - 0.0
  quat:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
regions:
  # The tray is physically 0.13 x 0.22 m (worst-case rotated radius ~0.13 m)
  # and the bun ~0.07 m; both spawn with free yaw. Their OOD zones previously
  # allowed the centre gap to shrink to ~0.07 m (< 0.13 + 0.07) -> the bun
  # could spawn embedded in the tray (object embedded in tray) and physics blew up.
  # The zones below guarantee a centre gap of >= 0.26 m in y for every draw
  # (bun y in [-0.29,-0.11], tray y in [0.17,0.27]) -> bodies never touch at
  # spawn. Ranges stay >= the ID 0.12 in x (wider) and offset from the ID
  # centres for layout variety.
  hotdog_bun_zone:
    center:
    - 0.4
    - -0.2
    - 0.8775
    xy_range:
    - 0.13
    - 0.09
    yaw_range:
    - -3.14
    - 3.14
  tray_zone:
    center:
    - 0.39
    - 0.22
    - 0.8775
    xy_range:
    - 0.1
    - 0.05
    yaw_range:
    - -3.14
    - 3.14
objects:
- name: hotdog_bun
  region: hotdog_bun_zone
- name: tray
  region: tray_zone
fixtures: []
goal:
- type: lifted
  args:
  - hotdog_bun
  subtask: Pick up the hotdog_bun
- type: 'on'
  args:
  - hotdog_bun
  - tray
  threshold: 0.08
  subtask: Place the hotdog_bun on the tray
  must_hold: true
obj_of_interest:
- hotdog_bun
- tray

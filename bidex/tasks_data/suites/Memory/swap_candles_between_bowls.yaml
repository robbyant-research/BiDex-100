name: swap_candles_between_bowls
language: Swap and restore the two candles.
subtasks:
- name: Left arm moves the left candle to the right bowl
  score: 20
- name: Right arm moves the right candle to the left bowl
  score: 20
- name: Left arm moves the right candle back to the right bowl
  score: 30
- name: Right arm moves the left candle back to the left bowl (restored)
  score: 30
- name: Right candle restored to the right bowl
  score: 0
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# Swap and restore two candles between two bowls (two-pass, mirroring
# tabletop_swap_straws_in_mugs / tabletop_swap_fruits). The bowls
# (rc/objaverse/plate/plate_7 and plate_8, both UNUSED) are freejoint with mass
# 200 (~50 kg) so they jitter per-episode within their y hemisphere yet stay
# fixed during the episode; each candle (rc/objaverse/candle/candle_0 and
# candle_1, both UNUSED) targets its bowl's live root (`obj{N}_root`) at a 0.13 m
# z offset so it drops centred over the bowl mouth and settles inside it no matter
# where the bowl was placed. `inside(candle, bowl, 0.08)` = candle within 8 cm xy
# of the bowl centre and within the +/-0.25 m z window. NOTE: no "toy" object
# exists in any asset set, so candles (the only UNUSED non-food graspable
# novelty) stand in for the requested toys; swap them for a real toy asset if one
# is added later. Bowls MUST be declared before the candles that target them so
# the instance ids line up (plate_7 -> obj1_root, plate_8 -> obj2_root).
# Two-pass goal: steps 1-2 SWAP (candle_0 -> right bowl plate_8, candle_1 -> left
# bowl plate_7); steps 3-5 swap them BACK so the final state equals the initial
# (candle_0 in left bowl plate_7, candle_1 in right bowl plate_8). The last two
# supported placements are must_hold (verify the restored config at episode end). The swap
# steps are NOT must_hold -- the candles leave their swapped bowls during the
# restore pass, so must_hold there would fail. `ordered_subtasks: true` (set
# below) gates the restore steps: they are ALREADY true at frame 0 (the candles
# start in their original bowls = the restored state) and must NOT latch until
# the swap steps have latched -- without ordering they would read "done" before
# the robot moves anything. No `lifted` subtasks (mirroring swap_straws): a
# candle reaching another bowl implies it was picked up.
# Region boxes (disjoint +/-y hemispheres):
#   left bowl  x[-0.05] y[-0.15]   right bowl x[-0.05] y[+0.15]
ordered_subtasks: true
regions:
  left_bowl_zone:
    center:
    - 0.07
    - -0.15
    - 0.85
    xy_range:
    - 0.1
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  right_bowl_zone:
    center:
    - 0.07
    - 0.15
    - 0.85
    xy_range:
    - 0.1
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  candle_left_zone:
    target: obj1_root
    center:
    - 0.0
    - 0.0
    - 0.13
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - -3.14
    - 3.14
  candle_right_zone:
    target: obj2_root
    center:
    - 0.0
    - 0.0
    - 0.13
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - -3.14
    - 3.14
objects:
- name: rc/objaverse/plate/plate_7
  region: left_bowl_zone
  mass: 200.0
- name: rc/objaverse/plate/plate_8
  region: right_bowl_zone
  mass: 200.0
- name: rc/objaverse/candle/candle_0
  region: candle_left_zone
- name: rc/objaverse/candle/candle_1
  region: candle_right_zone
fixtures: []
goal:
# Pass 1 -- SWAP the candles (candle_0 -> right bowl plate_8, candle_1 -> left
# bowl plate_7). Not must_hold: the candles leave these swapped bowls in pass 2.
- type: supported_in_region_band
  args:
  - rc/objaverse/candle/candle_0
  - rc/objaverse/plate/plate_8
  - reg_bbox
  - -0.02
  - 0.18
  subtask: Left arm moves the left candle to the right bowl
  threshold: 0.005
  order_group: swap_out
- type: supported_in_region_band
  args:
  - rc/objaverse/candle/candle_1
  - rc/objaverse/plate/plate_7
  - reg_bbox
  - -0.02
  - 0.18
  subtask: Right arm moves the right candle to the left bowl
  threshold: 0.005
  order_group: swap_out
# Pass 2 -- swap them BACK so the final state equals the initial state.
- type: supported_in_region_band
  args:
  - rc/objaverse/candle/candle_1
  - rc/objaverse/plate/plate_8
  - reg_bbox
  - -0.02
  - 0.18
  subtask: Left arm moves the right candle back to the right bowl
  threshold: 0.005
  order_group: swap_back
- type: supported_in_region_band
  args:
  - rc/objaverse/candle/candle_0
  - rc/objaverse/plate/plate_7
  - reg_bbox
  - -0.02
  - 0.18
  subtask: Right arm moves the left candle back to the left bowl (restored)
  threshold: 0.005
  must_hold: true
  order_group: swap_back
- type: supported_in_region_band
  args:
  - rc/objaverse/candle/candle_1
  - rc/objaverse/plate/plate_8
  - reg_bbox
  - -0.02
  - 0.18
  subtask: Right candle restored to the right bowl
  threshold: 0.005
  must_hold: true
  order_group: swap_back
obj_of_interest:
- rc/objaverse/plate/plate_7
- rc/objaverse/plate/plate_8
- rc/objaverse/candle/candle_0
- rc/objaverse/candle/candle_1

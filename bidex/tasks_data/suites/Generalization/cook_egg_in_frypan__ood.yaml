# OOD variant of tabletop_cook_egg_in_frypan (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: cook_egg_in_frypan
language: Pick up the frypan, then put the egg onto the frypan, and finally place the fork on the plate.
subtasks:
- name: Pick up the frypan
  score: 20
- name: Pick up the egg
  score: 15
- name: Put the egg on the frypan
  score: 15
- name: Pick up the fork
  score: 30
- name: Place the fork on the plate
  score: 20
ood:
  base_task: tabletop_cook_egg_in_frypan
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 3
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style

articulations:
- joint: body_to_lid
  object: chest_freezer_with_hinged_lid
  qpos: 0
fixtures: []
ordered_subtasks: true
goal:
- type: open
  args:
  - chest_freezer_with_hinged_lid
  - body_to_lid
  subtask: Open the chest freezer lid
  order_group: food
- type: lifted
  args:
  - ice_cube
  subtask: Pick up the ice cubes
  order_group: food
# inside_contact (NOT position `inside`): the freezer is FREE-JOINTED and can
# TIP over; the old `inside` (xy radius 0.22 + z window 0.25) then counted an
# ice_cube / boxed_food resting OUTSIDE the tipped chest against its base -- a
# false success. inside_contact requires a SUPPORT contact (vertical-normal
# contact, freezer floor/liner beneath the item), so only an item actually
# resting IN the freezer latches. must_hold rejects an item that later falls out.
- type: inside_contact
  args:
  - ice_cube
  - chest_freezer_with_hinged_lid
  subtask: Put the ice cubes inside the freezer
  must_hold: true
  order_group: food
- type: lifted
  args:
  - boxed_food
  subtask: Pick up the boxed food
  order_group: food
- type: inside_contact
  args:
  - boxed_food
  - chest_freezer_with_hinged_lid
  subtask: Put the boxed food inside the freezer
  must_hold: true
  order_group: food
- type: closed
  args:
  - chest_freezer_with_hinged_lid
  - body_to_lid
  subtask: Close the freezer lid
language: Open the chest freezer lid, put the ice cubes and boxed food inside, then close the freezer lid.
subtasks:
- name: Open the chest freezer lid
  score: 20
- name: Pick up the ice cubes

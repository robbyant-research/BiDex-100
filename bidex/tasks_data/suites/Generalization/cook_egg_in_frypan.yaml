fixtures: []
goal:
- type: lifted
  args:
  - chefmate_8_frypan
  # Explicit threshold: the frypan's body origin sits at the pan bottom, so it
  # rests at z ~= 0.80 (on the tabletop) even though its spawn region center is
  # z=0.85. The default `lifted` threshold (0.88, or 0.95 on older builds) is
  # measured from the spawn point, so it demanded lifting the pan origin +0.08
  # to +0.15 m before the subtask lit, which read as "must lift the pan very
  # high". 0.85 = rest z (~0.80) + ~5 cm, i.e. a clear pick-up off the table
  # without an excessive lift. Robust to the per-episode xy/yaw jitter (the
  # flat pan rests at the same z wherever it is placed).
  threshold: 0.85
  subtask: Pick up the frypan
- type: lifted
  args:
  - egg
  subtask: Pick up the egg
# inside_contact (NOT `on`): the egg must be SUPPORTED by the pan -- a
# vertical-normal contact with the pan subtree. The old `on(egg, frypan, 0.08)`
# only needed dxy < 0.08 and egg.z > pan.z - 0.02, which is already true for an
# egg standing on the TABLE next to the pan (the pan origin sits at table
# height), so a mere touch latched success. must_hold: the egg must still rest
# in the pan at the final frame.
- type: inside_contact
  args:
  - egg
  - chefmate_8_frypan
  subtask: Put the egg on the frypan
  must_hold: true
- type: lifted
  args:
  - fork
  subtask: Pick up the fork
# Same fix: the fork must rest ON the plate (support contact), not graze it
# from the table. must_hold keeps it honest at episode end.
- type: inside_contact
  args:
  - fork
  - plate
  subtask: Place the fork on the plate
  must_hold: true
obj_of_interest:
- chefmate_8_frypan
- plate
- egg
- fork

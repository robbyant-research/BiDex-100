regions:
  # All four sugar cubes share ONE spawn region with randomized x and y, so two
  # cubes may land at the same xy -> stacking is allowed (settled by physics).
  # The zone is shifted to the right-arm side (positive y); y in [0.0, +0.22]
  # so every cube is reachable by the right arm (which also has to reach the
  # bottle at y=0 to drop it in). Same initial scene as the two-cube task; only
  # the target count differs (this task: one cube). Target / forbidden cubes
  # are tracked by object identity (SugarCube00N).
  sugar_zone:
    center:
    - 0.2419
    - 0.176
    - 0.85
    xy_range:
    - 0.05
    - 0.11
    yaw_range:
    - -3.14
    - 3.14
    # Force the four cubes to spawn at distinct xy positions (>= 3.5 cm apart)
    # so they neither embed nor collide while falling -- each lands at its own
    # xy, no tumbling, no rolling off the table. (Distinct xy is the no-embed
    # guarantee here; z stays at the table spawn height.)
    min_distance: 0.035

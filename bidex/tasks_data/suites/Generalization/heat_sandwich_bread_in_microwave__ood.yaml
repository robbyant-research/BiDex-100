# OOD variant of tabletop_heat_sandwich_bread_in_microwave (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + arm_mirror(5.4) + baked distractors.
# (Random 5.3 injection is DISABLED -- injected cups/mugs kept crowding the
# microwave's front on the +y/+x side; a small ice cube and a mug are baked
# instead on the +x side, clear of the microwave and the bread.)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
fixtures: []
articulations:
- object: microwave
  joint: microjoint
  qpos: closed
# Ordered subtasks: the sequence is open -> pick up bread -> put inside ->
# close. The "Close the microwave door" predicate (`closed`) is a STATE check
# (door currently shut), and the door STARTS shut, so without ordering step 4
# would latch green at frame 0 (before the operator has done anything).
# ordered_subtasks gates step 4 behind steps 1-3, so it can only latch once
# the door has been opened, the bread placed inside, and then shut again --
# matching the language. (The microwave microjoint range is [-2.094, 0] with
# closed = 0; see _pred_open for the polarity fix that makes "open"/"closed"
# read correctly for that reversed range.)
ordered_subtasks: true
goal:
- type: open
  args:
  - microwave
  - microjoint
  subtask: Open the microwave door
- type: lifted
  args:
  - sandwich_bread
  subtask: Pick up the sandwich bread
- type: inside_site
  args:
  - sandwich_bread
  - microwave
  - heating_region
  - -0.12
  - 0.08
  subtask: Put the sandwich bread inside the microwave
  threshold: 0.0
  must_hold: true
- type: closed
  args:
  - microwave
  - microjoint
  subtask: Close the microwave door
  threshold: 0.15
language: Open the microwave, put the sandwich bread inside, and close the microwave.
subtasks:
- name: Open the microwave door
  score: 30
- name: Pick up the sandwich bread
  score: 20
- name: Put the sandwich bread inside the microwave
  score: 20
- name: Close the microwave door
  score: 30
ood:
  base_task: tabletop_heat_sandwich_bread_in_microwave
  scene_randomize: true
  baked_layout: true
  arm_mirror: true
name: heat_sandwich_bread_in_microwave
obj_of_interest:
- microwave
- sandwich_bread
objects:
- name: microwave
  region: microwave_zone
  scale: 1.5
  freejoint: true
- name: sandwich_bread
  region: sandwich_bread_zone
  scale: 1
  freejoint: true
- name: rc/lightwheel/ice_cube/IceCube001
  region: ood_ice_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/mug/mug_9
  region: ood_mug_zone
  scale: 1
  freejoint: true
regions:
  microwave_zone:
    center:
    - -0.1
    - 0.1
    - 0.85
    xy_range:
    - 0.02
    - 0.02
    # Fixed yaw (non-random): 15 deg CCW from the 30 deg-CW orientation ->
    # ~1.522 rad. A zero-width range collapses to yaw 0 in the sampler, so use
    # a 2 mrad pin. Keeps the footprint (+x to ~0.10, +y to ~0.19 worst-case)
    # clear of the bread zone at (0.2,-0.24).
    # Yaw is the ID task's [+1.522,+1.524] (door faces the same world direction
    # as in ID; the y-mirrored -1.523 turned the door/opening away).
    yaw_range:
    - 1.522
    - 1.524
  sandwich_bread_zone:
    center:
    - 0.2
    - -0.24
    - 0.85
    xy_range:
    - 0.04
    - 0.04
    yaw_range:
    - -3.14
    - 3.14
  # Baked OOD distractors on the +x side, clear of the microwave (worst box
  # x[-0.36,0.16] y[-0.19,0.39]) and of the bread (x[0.10,0.30] y[-0.36,-0.12]):
  #   ice cube: x[0.26,0.34] y[0.06,0.14]
  #   mug:      x[0.222,0.338] y[0.195,0.345]
  ood_ice_zone:
    center:
    - 0.3
    - 0.1
    - 0.8
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  ood_mug_zone:
    center:
    - 0.28
    - 0.27
    - 0.8
    xy_range:
    - 0.015
    - 0.015
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388

# Every object comes from previously-UNTOUCHED catalog categories: the whole
# rc/objaverse/tomato family is new (the bare LIBERO `tomato` name is used
# elsewhere, but these `rc/objaverse/tomato/tomato_*` instances are distinct)
# and the rc/lightwheel/strainer family is entirely new. A strainer is a
# concave mesh bowl (~20 x 11 cm oval, scale 2 -> ~40 x 22 cm). It is
# FREE-JOINTED (freejoint true, rest_on_surface true so its flat foot rests on
# the table, yaw pinned at pi to mirror its asymmetric orientation) and PICKABLE --
# the robot may lift/reposition it -- so it must stay a light dynamic body (no
# `mass` added, no weld). The three round ~6 cm tomatoes spawn on the +x side in
# a y-column.
# Predicate gates:
#  `lifted(strainer)` is a SEPARATE latching subtask: the robot must GRASP and
#    pick up the (light, pickable) strainer at some point. It latches once the
#    strainer origin rises above the default 0.95 m lift threshold, so it does
#    NOT false-fire at spawn (the strainer rests at z ~0.89 < 0.95). This makes
#    the strainer an actively-handled object, not just a static receiver.
#  `inside_contact(tomato, strainer)` -- NOT `inside_box` -- is the PLACE gate,
#    and it is used WITHOUT `must_hold` (latching, not final-frame-enforced).
#    Why not inside_box: it was position-only (tomato xy inside the strainer's
#    box footprint with |dz|<0.25), so merely MOVING THE STRAINER to sit
#    positionally under a tomato still RESTING ON THE TABLE read GREEN ("placed")
#    even though the tomato had not touched the strainer -- a false success.
#    inside_contact requires a SUPPORT contact (a vertical-normal contact
#    between the tomato and the strainer body subtree -- the strainer is
#    actually holding the tomato up), so a tomato on the table with the strainer
#    slid beneath it NEVER latches the place subtask (no support contact).
#    Why NO must_hold: the strainer is a light free-joint body, so when a tomato
#    lands in it the support contact wobbles and `inside_contact` flickers
#    True/False at the final frame -- a `must_hold` final-frame check would then
#    read a genuinely-placed tomato as NOT placed ("instability"). Dropping
#    must_hold makes the place subtask latch the FIRST frame inside_contact is
#    true (a genuine support contact -- the tomato really rested in the
#    strainer) and stay latched regardless of later wobble, so a placed tomato
#    reads success stably. (Trade-off: a tomato placed then later knocked back
#    out still counts, since the latch is sticky; the false-positive the
#    inside_box version had -- counting a never-placed tomato -- is gone, because
#    inside_contact only latches on a real support contact.) No `threshold` is
#    set -- inside_contact's `threshold` is a z_min floor, left at the default 0.
# Region boxes are disjoint. The strainer is centred at (-0.05, 0.10), while
# the three tomatoes occupy a y-column centred at x = 0.15 on the opposite side
# of the table. Their centres are 0.13 m apart in y and their jitter boxes do
# not overlap, leaving clearance both at initialization and after scaling.
regions:
  strainer_zone:
    center:
    - -0.05
    - 0.1
    - 0.85
    xy_range:
    - 0.06
    - 0.06
    # Rotate the asymmetric strainer 180 degrees so its bowl/handle
    # orientation is mirrored as well as its position.
    yaw_range:
    - 3.141593
    - 3.141593
    rest_on_surface: true
  tomato_a_zone:
    center:
    - 0.15
    - -0.06
    - 0.85
    xy_range:
    - 0.08
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
  tomato_b_zone:
    center:
    - 0.15
    - -0.19
    - 0.85
    xy_range:
    - 0.08
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
  tomato_c_zone:
    center:
    - 0.15
    - -0.32
    - 0.85
    xy_range:
    - 0.08
    - 0.02
    yaw_range:
    - -3.14
    - 3.14

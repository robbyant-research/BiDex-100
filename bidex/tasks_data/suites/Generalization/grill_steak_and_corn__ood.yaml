objects:
- name: grill_with_hinged_lid
  region: grill_zone
  scale: 0.6
  freejoint: true
- name: steak
  region: steak_zone
- name: corn
  region: corn_zone
- name: rc/objaverse/wine/wine_3
  region: ood_wine_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/canned_food/canned_food_0
  region: ood_can_zone
  scale: 1
  freejoint: true
fixtures: []
articulations:
- object: grill_with_hinged_lid
  joint: firebox_to_lid
  qpos: 0.0
# Ordered subtasks: the sequence is open lid -> pick steak -> place steak ->
# pick corn -> place corn -> close lid. The "Close the grill lid" predicate
# (`closed`) is a STATE check (lid currently shut), and the lid STARTS shut
# (qpos 0), so without ordering the last step would latch green at frame 0
# before the operator has done anything. ordered_subtasks gates it behind
# steps 1-5, so it can only latch once the lid has been opened, the steak and
# corn placed on the grill, and then shut again -- matching the language. The
# lid's firebox_to_lid range is [0, 1.8326] (closed = 0), so `open`/`closed`
# already read with the correct polarity here; only the frame-0 latch needed
# fixing. `must_hold: true` on the close step still enforces the lid is shut
# at the final frame.
ordered_subtasks: true
goal:
- type: open
  args:
  - grill_with_hinged_lid
  - firebox_to_lid
  threshold: 1.2
  subtask: Open the grill lid
  order_group: items
- type: lifted
  args:
  - steak
  threshold: 0.88
  subtask: Pick up the steak
  order_group: lift
- type: lifted
  args:
  - corn
  threshold: 0.88
  subtask: Pick up the corn
  order_group: lift
# inside_contact (NOT `on`): the grill's cooking grate bars spread ~0.19 m from
# the grill body origin, so `on(*, grill, 0.1)` missed food on the grate edges.
# inside_contact fires when the food is SUPPORTED by the grill subtree (any grate
# bar). must_hold keeps it on the grill at the final frame.
# The two lifts share order_group "lift" (interchangeable) and are declared
# BEFORE both puts, so Pick up the corn is NOT gated behind Put the steak.
- type: inside_contact
  args:
  - steak
  - grill_with_hinged_lid
  subtask: Put the steak on the grill
  must_hold: true
  order_group: items
- type: inside_contact
  args:
  - corn
  - grill_with_hinged_lid
  subtask: Put the corn on the grill
  must_hold: true
  order_group: items
- type: closed
  args:
  - grill_with_hinged_lid
  - firebox_to_lid
  must_hold: true
  subtask: Close the grill lid
obj_of_interest:
- grill_with_hinged_lid
- steak
- corn

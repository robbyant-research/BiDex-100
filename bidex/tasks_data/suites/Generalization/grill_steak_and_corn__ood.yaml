# OOD variant of tabletop_grill_steak (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + baked distractors
# (random 5.3 injection disabled: the distractor pool contains the ~40x30 cm
# `placemat`, which always embedded the grill/steak/corn when injected;
# a wine bottle + a can are baked in the clear bottom strip instead).
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: grill_steak_and_corn
language: Open the grill lid, put the steak and the corn on the grill, then close the grill lid.
subtasks:
- name: Open the grill lid
  score: 20
- name: Pick up the steak
  score: 20
- name: Put the steak on the grill
  score: 15
- name: Pick up the corn
  score: 15
- name: Put the corn on the grill
  score: 15
- name: Close the grill lid
  score: 15
ood:
  base_task: tabletop_grill_steak
  scene_randomize: true
  baked_layout: true
  geometry_safe_placement: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style

name: stack_sugar_cubes
language: With the left arm stack three sugar cubes on top of each other, and with the right arm stack three sugar cubes on top of each other.
subtasks:
- name: Left arm stacks the middle cube on the bottom cube
  score: 25
- name: Left arm stacks the top cube on the middle cube
  score: 25
- name: Right arm stacks the middle cube on the bottom cube
  score: 25
- name: Right arm stacks the top cube on the middle cube
  score: 25
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
regions:
  # Left stack (cubes 001-003) in the left-arm workspace (negative y), right
  # stack (cubes 004-006) in the right-arm workspace (positive y). Each zone is
  # a small randomized patch so the three cubes of a stack scatter on reset and
  # the operator/arm must gather and stack them.
  left_stack_zone:
    center:
    - 0.15
    - -0.14
    - 0.85
    xy_range:
    - 0.05
    - 0.08
    yaw_range:
    - -3.14
    - 3.14
    # Force the three cubes to spawn at distinct xy positions (>= 6 cm apart)
    # so they neither embed into each other nor pre-stack at spawn -- the
    # operator/arm must gather and stack them. z stays fixed (no stacking).
    min_distance: 0.08
  right_stack_zone:
    center:
    - 0.15
    - 0.14
    - 0.85
    xy_range:
    - 0.05
    - 0.08
    yaw_range:
    - -3.14
    - 3.14
    min_distance: 0.08
objects:
- name: rc/lightwheel/sugar_cube/SugarCube001
  region: left_stack_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube002
  region: left_stack_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube003
  region: left_stack_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube004
  region: right_stack_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube005
  region: right_stack_zone
  scale: 3
  freejoint: true
- name: rc/lightwheel/sugar_cube/SugarCube006
  region: right_stack_zone
  scale: 3
  freejoint: true
fixtures: []
goal:
# `stacked_on(upper, lower)` requires the upper cube to be one layer above the
# lower (z + 0.02..+0.06) within the xy radius -- i.e. a real stack, not two
# cubes side by side. `must_hold: true` makes each stack a live end-frame
# check: if a cube slips off by episode end the subtask fails (slide = no
# success).
# Left arm stacks bottom-to-top as 002 -> 003 -> 001, and right arm as
  # 005 -> 006 -> 004. The original top cubes (001 / 004) are now placed on
  # top and the original middle cubes (002 / 005) go on the bottom -- this
  # ordering is more stable to keep the stacks standing.
- type: stacked_on
  args:
  - rc/lightwheel/sugar_cube/SugarCube003
  - rc/lightwheel/sugar_cube/SugarCube002
  subtask: Left arm stacks the middle cube on the bottom cube
  threshold: 0.05
  must_hold: true
- type: stacked_on
  args:
  - rc/lightwheel/sugar_cube/SugarCube001
  - rc/lightwheel/sugar_cube/SugarCube003
  subtask: Left arm stacks the top cube on the middle cube
  threshold: 0.05
  must_hold: true
- type: stacked_on
  args:
  - rc/lightwheel/sugar_cube/SugarCube006
  - rc/lightwheel/sugar_cube/SugarCube005
  subtask: Right arm stacks the middle cube on the bottom cube
  threshold: 0.05
  must_hold: true
- type: stacked_on
  args:
  - rc/lightwheel/sugar_cube/SugarCube004
  - rc/lightwheel/sugar_cube/SugarCube006
  subtask: Right arm stacks the top cube on the middle cube
  threshold: 0.05
  must_hold: true
obj_of_interest:
- rc/lightwheel/sugar_cube/SugarCube001
- rc/lightwheel/sugar_cube/SugarCube002
- rc/lightwheel/sugar_cube/SugarCube003
- rc/lightwheel/sugar_cube/SugarCube004
- rc/lightwheel/sugar_cube/SugarCube005
- rc/lightwheel/sugar_cube/SugarCube006

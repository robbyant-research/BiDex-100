fixtures: []
goal:
- type: lifted
  args:
  - scissors
  threshold: 0.9
  subtask: Pick up the scissors
# inside_site_any over the caddy's 4 compartment sites (right/left/back/front
# _contain_region), NOT inside_box: inside_box accepts scissors merely LEANING
# against the caddy's EXTERIOR (within the wall footprint + z window), so a
# touch-but-not-placed-in counted as success. inside_site requires the scissors'
# centre inside a compartment site box AND a contact with the caddy body (resting
# on the compartment floor) -- only a genuinely-dropped-in scissors latches.
- type: inside_site_any
  args:
  - scissors
  - desk_caddy
  - right_contain_region
  - left_contain_region
  - back_contain_region
  - front_contain_region
  threshold: 0.02
  subtask: Put the scissors into the desk caddy
  must_hold: true
- type: lifted
  args:
  - bar_soap
  subtask: Pick up the soap
- type: inside_site_any
  args:
  - bar_soap
  - desk_caddy
  - right_contain_region
  - left_contain_region
  - back_contain_region
  - front_contain_region
  threshold: 0.02
  subtask: Put the soap into the desk caddy
  must_hold: true
- type: lifted
  args:
  - mug_tree
  subtask: Pick up the mug tree
- type: inside_box
  args:
  - mug_tree
  - desk_caddy
  subtask: Place the mug tree into the desk caddy
  threshold: 0.04
  must_hold: true
- type: upright
  args:
  - mug_tree
  threshold: 0.7
  subtask: Place the mug tree into the desk caddy
  must_hold: true

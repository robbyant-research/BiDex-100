  quat:
  - 1
  - 0
  - 0
  - 0
  scale: 1
  freejoint: false
  button: true
fixtures: []
goal:
# Step 1 -- the ordering gate: press the button exactly once (must_hold: a
# second press at any later point flips holds_now False). The press triggers
# the cap reveal, so this must latch first.
- type: pressed_exact
  args:
  - dexjoco_button_yellow
  - 3
  subtask: Right arm presses the yellow button exactly once, the caps appear
  must_hold: true
# Step 2 -- all three cubes covered by the appeared caps (any cap on each).
- type: inside_any
  args:
  - cube_a
  - cap_a
  - cap_b
  - cap_c
  subtask: All three cubes are covered by the caps
  threshold: 0.06
- type: inside_any
  args:
  - cube_grn_a
  - cap_a
  - cap_b
  - cap_c
  subtask: All three cubes are covered by the caps
  threshold: 0.06
- type: inside_any
  args:
  - cube_blu_a
  - cap_a
  - cap_b
  - cap_c
  subtask: All three cubes are covered by the caps
  threshold: 0.06
# Step 3 -- reveal ONLY the red cube: red uncovered (not inside ANY cap) AND
# green and blue still covered. All five must HOLD at the final frame, so
# lifting a second cap fails.
- type: not_inside
  args:
  - cube_a
  - cap_a
  subtask: Lift only the cap covering the red cube
  threshold: 0.06
  must_hold: true
- type: not_inside
  args:
  - cube_a
  - cap_b
  subtask: Lift only the cap covering the red cube
  threshold: 0.06
  must_hold: true
- type: not_inside
  args:
  - cube_a
  - cap_c
  subtask: Lift only the cap covering the red cube
  threshold: 0.06
  must_hold: true
- type: inside_any
  args:
  - cube_grn_a
  - cap_a
  - cap_b
  - cap_c
  subtask: Green cube still covered at the end
  threshold: 0.06
  must_hold: true
- type: inside_any
  args:
  - cube_blu_a
  - cap_a
  - cap_b
  - cap_c
  subtask: Blue cube still covered at the end
  threshold: 0.06
  must_hold: true
obj_of_interest:
- cube_a
- cube_grn_a
- cube_blu_a
- cap_a
- cap_b
- cap_c
- dexjoco_button_yellow

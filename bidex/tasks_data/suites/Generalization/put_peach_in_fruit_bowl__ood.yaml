# OOD variant of kitchen_put_peach_in_fruit_bowl (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: put_peach_in_fruit_bowl
language: Pick up the peach and put it in the fruit bowl.
subtasks:
- name: Pick up the peach
  score: 50
- name: Place the peach in the fruit_bowl
  score: 50
ood:
  base_task: kitchen_put_peach_in_fruit_bowl
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 5
robot_type: astribot_s1_fixed_sharpa
scene: dexjoco_table_arena
robot_pose:
  pos:
  - 0.8
  - 0.0
  - 0.0
  quat:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
regions:
  # Peach stays at the ID centre with a slightly wider x range (0.12->0.13) --
  # kitchen-OOD rule: grasped items never leave the arms' workspace. The
  # fruit_bowl is physically large (0.33 x 0.24 m, rotated radius ~0.20 m);
  # its OOD centre at y 0.21 with +-0.12 jitter let its rim reach the peach
  # zone (peach could drop INTO the bowl at spawn or collide with the bowl).
  # Moved to y 0.31 with +-0.06 y jitter: bowl edge >= 0.25-0.20 = 0.05 stays
  # clear of the peach (max y -0.02+0.045 = 0.025); x jitter +-0.12 keeps a
  # harmless layout offset.
  peach_zone:
    center:
    - 0.4
    - -0.15
    - 0.8775
    xy_range:
    - 0.13
    - 0.12
    yaw_range:
    - -3.14
    - 3.14
  fruit_bowl_zone:
    center:
    - 0.38
    - 0.31
    - 0.8775
    xy_range:
    - 0.12
    - 0.06
    yaw_range:
    - -3.14
    - 3.14
objects:
- name: peach
  region: peach_zone
- name: fruit_bowl
  region: fruit_bowl_zone
fixtures: []
goal:
- type: lifted
  args:
  - peach
  subtask: Pick up the peach
- type: inside
  args:
  - peach
  - fruit_bowl
  threshold: 0.1
  subtask: Place the peach in the fruit_bowl
  must_hold: true
obj_of_interest:
- peach
- fruit_bowl

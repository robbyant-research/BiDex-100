name: pour_ice_between_two_cups
language: Right arm pours the ice from the right cup into the left cup, then left
  arm pours it back into the right cup and sets both cups down.
subtasks:
- name: Right arm pours the ice from the right cup into the left cup
  score: 50
- name: Left arm pours the ice back into the right cup and sets both cups down
  score: 50
ood:
  base_task: tabletop_pour_ice_cups
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
ordered_subtasks: true
regions:
  cup_pos_zone:
    center:
    - 0.2023
    - 0.1077
    - 0.87
    xy_range:
    - 0.1
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  cup_neg_zone:
    center:
    - 0.1912
    - -0.1645
    - 0.87
    xy_range:
    - 0.1
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  ice_zone:
    target: obj1_root
    center:
    - 0.0
    - 0.0
    - 0.11
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - -3.14
    - 3.14
objects:
- name: rc/lightwheel/glass_cup/GlassCup005
  region: cup_pos_zone
  scale: 1.2
  freejoint: true
- name: rc/lightwheel/glass_cup/GlassCup010
  region: cup_neg_zone
  scale: 1.2
  freejoint: true
- name: dexjoco_ice_ball
  region: ice_zone
  freejoint: true
fixtures: []
goal:
# Subtask 1 ("pour into the LEFT cup"): ice must be IN GlassCup010 AND NO LONGER IN
# GlassCup005. The bare in_bottle(ice, Cup010) latched the instant the ice entered
# Cup010 -- even while it was still touching/in GlassCup005 mid-transfer (two cups
# held rim-to-rim). Adding not_in_bottle(ice, Cup005) forces the pour to actually
# complete (ice fully out of Cup005) before subtask 1 latches. No must_hold: it is
# an intermediate milestone (subtask 2 then pours the ice back).
- type: in_bottle
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup010
  threshold: 0.08
  subtask: Right arm pours the ice from the right cup into the left cup
- type: not_in_bottle
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup005
  threshold: 0.08
  subtask: Right arm pours the ice from the right cup into the left cup
- type: in_bottle
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup005
  threshold: 0.08
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
# Subtask 2 ("pour back into the RIGHT cup"): symmetric -- ice IN GlassCup005 AND
# NO LONGER IN GlassCup010, so the reverse pour must complete (not mid-transfer).
- type: not_in_bottle
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup010
  threshold: 0.08
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
- type: 'on'
  args:
  - rc/lightwheel/glass_cup/GlassCup005
  - cup_pos_zone
  threshold: 0.2
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
- type: 'on'
  args:
  - rc/lightwheel/glass_cup/GlassCup010
  - cup_neg_zone
  threshold: 0.2
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
obj_of_interest:
- dexjoco_ice_ball
- rc/lightwheel/glass_cup/GlassCup005
- rc/lightwheel/glass_cup/GlassCup010

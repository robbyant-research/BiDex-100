# OOD variant of tabletop_store_condiments_in_short_cabinet (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
articulations:
- joint: middle_level
  object: short_cabinet
  qpos: closed
- joint: top_region
  object: short_cabinet
  qpos: closed
fixtures: []
ordered_subtasks: true
goal:
# Accept opening EITHER the middle drawer (joint middle_level) OR the top drawer
# (joint top_region). open_any OR's _pred_open over the listed joints.
- type: open_any
  args:
  - short_cabinet
  - middle_level
  - top_region
  subtask: Open the short cabinet drawer
- type: lifted
  args:
  - ketchup
  subtask: Pick up the ketchup
  threshold: 0.88
  order_group: items
# Ketchup may go into EITHER drawer. inside_site_any OR's _pred_inside_site over
# the listed sites (middle_region / top_region); the contact gate picks the
# drawer the bottle actually rests in.
- type: inside_site_any
  args:
  - ketchup
  - short_cabinet
  - middle_region
  - top_region
  subtask: Put the ketchup inside the short cabinet
  threshold: 0.02
  order_group: items
- type: lifted
  args:
  - bbq_sauce
  subtask: Pick up the BBQ sauce
  threshold: 0.88
  order_group: items
- type: inside_site_any
  args:
  - bbq_sauce
  - short_cabinet
  - middle_region
  - top_region
  subtask: Put the BBQ sauce inside the short cabinet
  threshold: 0.02
  order_group: items
# Close step: require BOTH drawers closed. Whichever drawer the robot opened, the
# other was never touched (stays closed), so closing the opened one leaves both
# shut -- correct end state regardless of which drawer was used. Both closed is
# true at frame 0 but gated by ordering until open + items are done.
- type: closed
  args:
  - short_cabinet
  - middle_level
  subtask: Close the short cabinet drawer
- type: closed
  args:
  - short_cabinet
  - top_region
  subtask: Close the short cabinet drawer
language: Open the short cabinet drawer, put the ketchup inside, put the BBQ sauce inside, then close the drawer.
subtasks:
- name: Open the short cabinet drawer
  score: 15
- name: Pick up the ketchup
  score: 15
- name: Put the ketchup inside the short cabinet
  score: 20
- name: Pick up the BBQ sauce
  score: 15
- name: Put the BBQ sauce inside the short cabinet
  score: 20
- name: Close the short cabinet drawer
  score: 15
ood:
  base_task: tabletop_store_condiments_in_short_cabinet
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 4
name: store_condiments_in_short_cabinet
obj_of_interest:
- short_cabinet
- ketchup
- bbq_sauce
objects:
- name: short_cabinet
  region: short_cabinet_zone
  scale: 1.7
  freejoint: true
- name: ketchup
  region: ketchup_zone
  scale: 1
  freejoint: true
- name: bbq_sauce
  region: bbq_sauce_zone
  scale: 1
  freejoint: true
regions:
  bbq_sauce_zone:
    center:
    - 0.2233
    - -0.1366
    - 0.85
    xy_range:
    - 0.04
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  ketchup_zone:
    center:
    - 0.2233
    - 0.0634
    - 0.85
    xy_range:
    - 0.04
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  short_cabinet_zone:
    # Center moved (-0.2,0.22) -> (-0.16,0.12) and xy shrunk 0.12 -> 0.02: at
    # the old center the cabinet's true mesh bbox reached y=0.438 / x=-0.414
    # (yaw 1.2) -- OFF the table (edge ±0.4). At (-0.16,0.12)+0.02 jitter the
    # worst yaw-1.2 corner is x[-0.394,0.07] y[-0.10,0.36] -- fully on the
    # table, and x max 0.07 stays clear of the ketchup/bbq zones (x >= 0.11).
    center:
    - -0.16
    - 0.12
    - 0.85
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - 1.2
    - 1.55
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style

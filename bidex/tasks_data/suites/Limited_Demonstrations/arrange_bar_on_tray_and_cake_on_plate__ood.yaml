# OOD variant of tabletop_arrange_bar_on_tray_cake_on_plate (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: arrange_bar_on_tray_and_cake_on_plate
language: Place the food bar on the tray, then place the cake on the plate.
subtasks:
- name: Pick up the food bar
  score: 20
- name: Place the food bar on the tray
  score: 30
- name: Pick up the cake
  score: 20
- name: Place the cake on the plate
  score: 30
ood:
  base_task: tabletop_arrange_bar_on_tray_cake_on_plate
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos: [0.5, -0.45, 0.6]
  quat: [0.382683, 0, 0, 0.92388]
# MULTI-TARGET ORDERED archetype (2 items to 2 DIFFERENT targets in sequence,
# different from sort (unordered, same-type items to 2 containers) and from
# swap (cross-transfer between 2 containers)). A food bar (bar_9, UNTOUCHED,
# ~19 cm) goes on a tray (Tray003, UNTOUCHED, scale 0.6, mass 200); then a
# cake (cake_4, UNTOUCHED, ~12 cm) goes on a plate (plate_19, UNTOUCHED, mass
# 200). The tray and plate occupy opposite y-hemispheres on the -x side; the
# bar and cake spawn on the +x side. Ordered: the bar-on-tray subtask gates
# the cake-on-plate subtask.
# OOD layout tweak: the two receptacles (tray <-> plate) and the two snacks
# (bar <-> cake) have their spawn CENTRES swapped vs ID, so bar still pairs with
# tray and cake with plate but on flipped y/x sides.
regions:
  tray_zone:
    center:
    - -0.08
    - -0.1442
    - 0.85
    xy_range: [0.08, 0.08]
    yaw_range: [-0.05, 0.05]
    rest_on_surface: true
  plate_zone:
    center:
    - -0.08
    - 0.1757
    - 0.85
    xy_range: [0.08, 0.08]
    yaw_range: [-0.05, 0.05]
    rest_on_surface: true
  bar_zone:
    center:
    - 0.2802
    - -0.211
    - 0.85
    xy_range: [0.08, 0.08]
    yaw_range: [1.52, 1.62]
  cake_zone:
    center:
    - 0.3074
    - 0.2121
    - 0.85
    xy_range: [0.08, 0.08]
    yaw_range: [-3.14, 3.14]
objects:
- name: rc/lightwheel/tray/Tray003
  region: tray_zone
  scale: 0.6
  freejoint: true
  mass: 200
- name: rc/objaverse/plate/plate_19
  region: plate_zone
  scale: 1
  freejoint: true
  mass: 200
- name: rc/objaverse/bar/bar_9
  region: bar_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/cake/cake_4
  region: cake_zone
  scale: 1
  freejoint: true
fixtures: []
goal:
- type: lifted
  args: [rc/objaverse/bar/bar_9]
  threshold: 0.85
  subtask: Pick up the food bar
- type: 'on'
  args: [rc/objaverse/bar/bar_9, rc/lightwheel/tray/Tray003]
  subtask: Place the food bar on the tray
  threshold: 0.10
  must_hold: true
- type: lifted
  args: [rc/objaverse/cake/cake_4]
  subtask: Pick up the cake
  threshold: 0.85
- type: 'on'
  args: [rc/objaverse/cake/cake_4, rc/objaverse/plate/plate_19]
  subtask: Place the cake on the plate
  threshold: 0.10
  must_hold: true
obj_of_interest:
- rc/lightwheel/tray/Tray003
- rc/objaverse/plate/plate_19
- rc/objaverse/bar/bar_9
- rc/objaverse/cake/cake_4

objects:
- name: rc/lightwheel/dish_rack/DishRack026
  region: dish_rack_zone
  scale: 1.1
  freejoint: true
  mass: 5
- name: rc/lightwheel/strainer/Strainer002
  region: strainer_zone
  scale: 1.5
  freejoint: true
  rest_on_surface: true
- name: rc/objaverse/tomato/tomato_0
  region: tomato_a_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/tomato/tomato_1
  region: tomato_b_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/spoon/spoon_5
  region: spoon_zone
  scale: 1
  freejoint: true
fixtures: []
goal:
- type: lifted
  args:
  - rc/lightwheel/strainer/Strainer002
  subtask: Pick up the strainer
  threshold: 0.92
- type: lifted
  args:
  - rc/objaverse/tomato/tomato_0
  subtask: Pick up the first tomato
  threshold: 0.91
# inside_site(bowl_region) -- NOT inside_box: the strainer's reg_bbox footprint
# covers the bowl (+y) AND the handle (-y), so inside_box counted a tomato that
# landed ON the handle. bowl_region (a site at the bowl interior, +y) restricts
# the xy test to the bowl lobe only; the contact gate + must_hold finish the
# check. (Strainer002 model.xml carries the bowl_region site; drain_three_tomatoes
# uses the same gate.)
- type: inside_site
  args:
  - rc/objaverse/tomato/tomato_0
  - rc/lightwheel/strainer/Strainer002
  - bowl_region
  threshold: 0.02
  subtask: Place the first tomato into the strainer
  must_hold: true
- type: lifted
  args:
  - rc/objaverse/tomato/tomato_1
  subtask: Pick up the second tomato
  threshold: 0.91
- type: inside_site
  args:
  - rc/objaverse/tomato/tomato_1
  - rc/lightwheel/strainer/Strainer002
  - bowl_region
  threshold: 0.02
  subtask: Place the second tomato into the strainer
  must_hold: true
- type: inside_box
  args:
  - rc/lightwheel/strainer/Strainer002
  - rc/lightwheel/dish_rack/DishRack026
  subtask: Place the strainer onto the dish rack
  threshold: 0.04
  must_hold: true
- type: lifted
  args:
  - rc/objaverse/spoon/spoon_5
  subtask: Pick up the spoon
  threshold: 0.89
# The asset's reg_int_0/reg_int_1 boxes cover wire-rack bays, not the black
# corner utensil holder. These bounds are the holder interior in DishRack026's
# live local frame. A spoon may remain wedged against a side wall, so containment
# is paired with long_axis_vertical and both predicates must hold at episode end.
- type: inside_local_box
  args:
  - rc/objaverse/spoon/spoon_5
  - rc/lightwheel/dish_rack/DishRack026
  - 0.03
  - 0.19
  - 0.095
  - 0.17
  - -0.05
  - 0.18
  threshold: 0.005
  subtask: Place the spoon onto the dish rack
  must_hold: true
- type: long_axis_vertical
  args:
  - rc/objaverse/spoon/spoon_5
  - reg_bbox
  threshold: 0.35
  subtask: Place the spoon onto the dish rack
  must_hold: true
obj_of_interest:
- rc/lightwheel/dish_rack/DishRack026
- rc/lightwheel/strainer/Strainer002
- rc/objaverse/tomato/tomato_0
- rc/objaverse/tomato/tomato_1
- rc/objaverse/spoon/spoon_5

# OOD variant of tabletop_prepare_tea_with_cup (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + baked distractors.
# Two small distractors are baked in with verified-clear regions (bottom band of
# the table). The cup / placemat / honey / teapot regions are pairwise disjoint;
# honey/teapot worst-case footprints may touch the 8mm-flat placemat -- that is
# the intended "set X on the placemat" geometry, not embedding.
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: prepare_tea_with_cup
language: Pick up the cup and place it on the placemat, then put the honey bottle next to the cup, and place the teapot on the placemat.
subtasks:
- name: Pick up the cup
  score: 15
- name: Place the cup on the placemat
  score: 15
- name: Pick up the honey bottle
  score: 15
- name: Place the honey bottle on the placemat
  score: 20
- name: Pick up the teapot
  score: 15
- name: Place the teapot on the placemat
  score: 20
ood:
  base_task: tabletop_prepare_tea_with_cup
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0.0
  - 0.0
  - 0.92388
regions:
  # Task-object zones reverted to the ID spacing: the prior OOD region_offset
  # pulled the honey_bottle (and teapot) inward to x ~0.14, which landed INSIDE
  # the large placemat's xy footprint (~0.40 x 0.29 m, centred at -0.05,0.22) ->
  # init penetration (honey base clipping the placemat). At x ~0.20 the bottles
  # clear the placemat's +x edge (matches the working ID layout). The OOD still
  # differs from ID via scene_randomize + the baked apple/ice distractors below.
  cup_zone:
    center:
    - -0.25
    - -0.15
    - 0.85
    xy_range:
    - 0.08
    - 0.08
    yaw_range:
    - -0.3
    - 0.3
  placemat_zone:
    center:
    - -0.05
    - 0.2
    - 0.85
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - -0.15
    - 0.15
  honey_bottle_zone:
    center:
    - 0.28
    - 0.15
    - 0.85
    xy_range:
    - 0.08
    - 0.08
    yaw_range:
    - -0.3
    - 0.3
  teapot_zone:
    center:
    - 0.2
    - -0.15
    - 0.85
    xy_range:
    - 0.08
    - 0.08
    yaw_range:
    - -0.2
    - 0.2
  # Baked OOD distractors in the table's bottom band, clear of every task
  # object's worst-case spawn box:
  #   apple and ice use pinned edge-band zones outside all task-object ranges.
  ood_apple_zone:
    center:
    - -0.30
    - -0.31
    - 0.8
    xy_range:
    - 0.005
    - 0.005
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  ood_ice_zone:
    center:
    - 0.30
    - -0.30
    - 0.8
    xy_range:
    - 0.005
    - 0.005
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
objects:
- name: cup
  region: cup_zone
- name: placemat
  region: placemat_zone
- name: honey_bottle
  region: honey_bottle_zone
- name: teapot
  region: teapot_zone
- name: rc/objaverse/apple/apple_13
  region: ood_apple_zone
  freejoint: true
- name: rc/lightwheel/ice_cube/IceCube001
  region: ood_ice_zone
  freejoint: true
fixtures: []
goal:
- type: lifted
  args:
  - cup
  subtask: Pick up the cup
# inside_contact (NOT `on`): the placemat is a thin FREE-JOINT mat -- `on` (xy
# radius 0.1) sometimes missed an object resting near the placemat edge or after
# the mat shifted beneath it. inside_contact requires the object be SUPPORTED by
# the placemat (vertical contact), which is edge- and shift-robust; must_hold
# requires it still resting on the mat at the final frame. (Same gate for the
# honey bottle and the teapot.)
- type: inside_contact
  args:
  - cup
  - placemat
  subtask: Place the cup on the placemat
  must_hold: true
- type: lifted
  args:
  - honey_bottle
  subtask: Pick up the honey bottle
- type: inside_contact
  args:
  - honey_bottle
  - placemat
  subtask: Place the honey bottle on the placemat
  must_hold: true
- type: lifted
  args:
  - teapot
  subtask: Pick up the teapot
- type: inside_contact
  args:
  - teapot
  - placemat
  subtask: Place the teapot on the placemat
  must_hold: true
obj_of_interest:
- cup
- placemat
- honey_bottle
- teapot

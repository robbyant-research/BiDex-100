# OOD variant of tabletop_stack_three_canned_food (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + baked distractors
# (random 5.3 injection disabled: an injected fruit bowl sat on top of the tins;
# apple + paprika are baked clear of them instead).
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: stack_three_canned_food
language: Stack the three cans on top of each other.
subtasks:
- name: Pick up the middle can
  score: 10
- name: Stack the middle can on the base can
  score: 40
- name: Pick up the top can
  score: 10
- name: Stack the top can on the middle can
  score: 40
ood:
  base_task: tabletop_stack_three_canned_food
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# Three DISTINCT, previously-UNUSED canned_food instances (canned_food_4/5/6 --
# distinct from the canned_food_0/1/3 the dish-rack task uses). They are short
# food tins ~9.1-9.6 cm tall and ~6.5-6.8 cm wide, so a flush column raises the
# upper centre ~0.093-0.096 m per layer. The base tin (canned_food_5) is WELDED
# (freejoint false, rest_on_surface true so its flat rim sits on the table, yaw
# pinned 0) as the fixed stack target on the -x side; canned_food_4 (mid) and
# canned_food_6 (top) are free-jointed and spawn on the +x side, each to be
# lifted and stacked in sequence. Stacking follows tabletop_stack_bowls:
# `stacked_on(upper, lower, z_lo, z_hi)` with an explicit z WINDOW (0.07, 0.13)
# and `threshold` 0.05 m xy, `must_hold: true`.
#
# The z window is the real discriminator for cans: a neat one-tin layer raises
# the upper centre ~0.094 m -- inside (0.07, 0.13) -- while two tins side by
# side (dz ~0 < 0.07) and a two-layer gap (dz ~0.19 > 0.13) are BOTH rejected.
# The 0.05 m xy radius further rejects a tin set BESIDE the column (two tins
# touching sit ~0.065 m apart > 0.05). The base tin is welded (not free-jointed
# like stack_bowls' base) because -- unlike nested bowls -- a can column is NOT
# self-capturing, so an immovable base keeps the lower contact from sliding
# while the upper tins are placed.
#
# Worst-case spawn boxes (region jitter + rotated footprint) are DISJOINT:
# base (0,0.0256) xy 0.04 -> x[-0.074,0.074] y[-0.048,0.100]; mid (0.22,0.19)
# xy 0.05 -> x[0.130,0.310] y[0.100,0.280]; top (0.22,-0.16) xy 0.05 ->
# x[0.128,0.313] y[-0.253,-0.068]. base-to-upper tins are x-separated by >=
# 5.4 cm; mid-to-top are y-separated by ~16 cm, so no two tins can touch at
# spawn (the previous xy 0.08 jitter made base-vs-mid boxes overlap by up to
# ~2.5 cm in x -> tins could spawn embedded).
regions:
  tin_base_zone:
    center:
    - 0.0
    - 0.0256
    - 0.8
    xy_range:
    - 0.04
    - 0.04
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
  tin_mid_zone:
    center:
    - 0.22
    - 0.19
    - 0.85
    xy_range:
    - 0.05
    - 0.05
    yaw_range:
    - -0.3
    - 0.3
  tin_top_zone:
    center:
    - 0.22
    - -0.16
    - 0.85
    xy_range:
    - 0.05
    - 0.05
    yaw_range:
    - -0.3
    - 0.3
  # Baked OOD distractors (random 5.3 injection disabled -- an injected
  # FruitBowl002 used to sit on top of the tins). apple box
  # x[-0.320,-0.181] y[-0.070,0.070] (left of base), paprika box
  # x[-0.324,-0.176] y[0.196,0.344] (top-left); both disjoint from the tins.
  ood_apple_zone:
    center:
    - -0.25
    - 0.0
    - 0.8
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  ood_paprika_zone:
    center:
    - -0.25
    - 0.27
    - 0.8
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true

  corn_zone:
    center:
    - 0.27
    - -0.25
    - 0.85
    # Moved right/down with tighter jitter: the yaw-rotated grill (fp
    # 0.18x0.178, yaw -1.5..-1.2) sweeps its front edge to ~(x 0.20, y -0.23)
    # at worst jitter; at (0.1813,-0.0421) the corn's box reached 6+ cm INTO

name: pour_ice_between_two_cups
language: Right arm pours the ice from the right cup into the left cup, then left
  arm pours it back into the right cup and sets both cups down.
subtasks:
- name: Right arm pours the ice from the right cup into the left cup
  score: 50
- name: Left arm pours the ice back into the right cup and sets both cups down
  score: 50
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
ordered_subtasks: true
regions:
  cup_pos_zone:
    center:
    - 0.15
    - 0.15
    - 0.87
    xy_range:
    - 0.1
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  cup_neg_zone:
    center:
    - 0.15
    - -0.15
    - 0.87
    xy_range:
    - 0.1
    - 0.04
    yaw_range:
    - -0.3
    - 0.3
  ice_zone:
    target: obj1_root
    center:
    - 0.0
    - 0.0
    - 0.11
    xy_range:
    - 0.0
    - 0.0
    yaw_range:
    - -3.14
    - 3.14
objects:
- name: rc/lightwheel/glass_cup/GlassCup005
  region: cup_pos_zone
  scale: 1.2
  freejoint: true
- name: rc/lightwheel/glass_cup/GlassCup010
  region: cup_neg_zone
  scale: 1.2
  freejoint: true
- name: dexjoco_ice_ball
  region: ice_zone
  freejoint: true
fixtures: []
goal:
# Subtask 1 ("pour into the LEFT cup"): the ice centre must enter GlassCup010's
# live interior region and leave GlassCup005's. Physics keeps a settled ball
# within the cup wall; requiring a full-radius inward clearance made valid
# near-wall placements impossible. An exterior touch still lies outside reg_int.
# No must_hold: this is an intermediate milestone before the reverse pour.
- type: inside_region
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup010
  - reg_int
  subtask: Right arm pours the ice from the right cup into the left cup
- type: not_inside_region
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup005
  - reg_int
  subtask: Right arm pours the ice from the right cup into the left cup
- type: inside_region
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup005
  - reg_int
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
# Subtask 2 ("pour back into the RIGHT cup"): symmetric -- ice IN GlassCup005 AND
# NO LONGER IN GlassCup010, so the reverse pour must complete (not mid-transfer).
- type: not_inside_region
  args:
  - dexjoco_ice_ball
  - rc/lightwheel/glass_cup/GlassCup010
  - reg_int
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
- type: 'on'
  args:
  - rc/lightwheel/glass_cup/GlassCup005
  - cup_pos_zone
  threshold: 0.2
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
- type: 'on'
  args:
  - rc/lightwheel/glass_cup/GlassCup010
  - cup_neg_zone
  threshold: 0.2
  subtask: Left arm pours the ice back into the right cup and sets both cups down
  must_hold: true
obj_of_interest:
- dexjoco_ice_ball
- rc/lightwheel/glass_cup/GlassCup005
- rc/lightwheel/glass_cup/GlassCup010

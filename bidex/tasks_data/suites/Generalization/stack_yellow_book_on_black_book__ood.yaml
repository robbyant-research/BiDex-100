# OOD variant of tabletop_stack_yellow_book_on_black_book (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: stack_yellow_book_on_black_book
language: Pick up the yellow book and stack it on top of the black book.
subtasks:
- name: Pick up the yellow book
  score: 40
- name: Stack the yellow book on the black book
  score: 60
ood:
  base_task: tabletop_stack_yellow_book_on_black_book
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 5
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0.0
  - 0.0
  - 0.92388
regions:
  yellow_book_zone:
    center:
    - 0.2398
    - -0.1324
    - 0.85
    xy_range:
    - 0.12
    - 0.12
    yaw_range:
    - -0.3
    - 0.3
  black_book_zone:
    center:
    - -0.1
    - 0.2361
    - 0.85
    xy_range:
    - 0.12
    - 0.12
    yaw_range:
    - -0.3
    - 0.3
objects:
- name: yellow_book
  region: yellow_book_zone
- name: black_book
  region: black_book_zone
fixtures: []
goal:
- type: lifted
  args:
  - yellow_book
  threshold: 0.88
  subtask: Pick up the yellow book
# stacked_on (stricter than `on`): yellow must be directly ON TOP of black -- xy
# within 0.10 m AND one layer above (z delta in 0.005..0.22 m, covering a flat
# 2.4-cm-thick book stack up to a 12-cm upright stack; the lower bound 0.005
# rejects side-by-side same-height). xy widened 0.08->0.10 (the book is ~10 cm
# wide; clips placed slightly off-centre were rejected at 0.08). must_hold keeps
# the stack held at the final frame.
- type: stacked_on
  args:
  - yellow_book
  - black_book
  - 0.005
  - 0.22
  threshold: 0.1
  subtask: Stack the yellow book on the black book
  must_hold: true
obj_of_interest:
- yellow_book
- black_book

# OOD variant of kitchen_put_onion_on_cutting_board (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: put_onion_on_cutting_board
language: Pick up the onion and place it on the cutting board.
subtasks:
- name: Pick up the onion
  score: 50
- name: Place the onion on the cutting_board
  score: 50
ood:
  base_task: kitchen_put_onion_on_cutting_board
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 5
robot_type: astribot_s1_fixed_sharpa
scene: dexjoco_table_arena
robot_pose:
  pos:
  - 0.8
  - 0.0
  - 0.0
  quat:
  - 0.0
  - 0.0
  - 0.0
  - 1.0
regions:
  # The previous OOD mirrored the onion and the cutting board left<->right
  # (arm_mirror); per the kitchen-OOD rule the grasped item stays at the ID
  # centre with only a slightly wider x range (0.12->0.13). The long cutting
  # board uses a separate +y band and limited yaw: its complete footprint stays
  # on the table and cannot intersect the onion's -y sampling band.
  onion_zone:
    center:
    - 0.4
    - -0.15
    - 0.8775
    xy_range:
    - 0.13
    - 0.12
    yaw_range:
    - -3.14
    - 3.14
  cutting_board_zone:
    center:
    - 0.4
    - 0.28
    - 0.8775
    xy_range:
    - 0.12
    - 0.03
    yaw_range:
    - -0.15
    - 0.15
objects:
- name: onion
  region: onion_zone
- name: cutting_board
  region: cutting_board_zone
fixtures: []
goal:
- type: lifted
  args:
  - onion
  subtask: Pick up the onion
- type: 'on'
  args:
  - onion
  - cutting_board
  threshold: 0.08
  subtask: Place the onion on the cutting_board
  must_hold: true
obj_of_interest:
- onion
- cutting_board

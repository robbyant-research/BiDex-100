# OOD variant of tabletop_arrange_three_bagels_in_oven_tray (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: arrange_three_bagels_in_oven_tray
language: Pick up the three bagels one at a time and lay each flat in the oven tray so it rests within the tray.
subtasks:
- name: Pick up the first bagel
  score: 10
- name: Lay the first bagel in the oven tray
  score: 20
- name: Pick up the second bagel
  score: 10
- name: Lay the second bagel in the oven tray
  score: 25
- name: Pick up the third bagel
  score: 10
- name: Lay the third bagel in the oven tray
  score: 25
ood:
  base_task: tabletop_arrange_three_bagels_in_oven_tray
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 3
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# Every object is from a previously-UNTOUCHED category: bagel_1/2/3 are free
# instances (the breakfast task uses bagel_0) and OvenTray002 is a free instance
# (the two-spoons / canned-food / strainer tasks use other OvenTray indices). An
# oven tray is a flat ~0.40 x 0.28 m slab with low rims -- a heavy station
# (freejoint + mass 200, rest_on_surface true so its flat underside sits on the
# table, yaw pinned 0) as the fixed arrange target on the -x side; the three
# ~10 cm bagels spawn free-jointed on the +x side in a y-column.
#
# `inside_box` (NOT contact-gated `inside_contact`, NOT circular `inside`) is the
# gate here: a bagel counts as arranged only when its xy lies within the tray
# subtree's BOX geom half-extents + margin (threshold 0.04 m). The tray's rim
# defines a clear rectangular footprint, so the box-extent test is the natural
# fit (it falls back to a circular test only if no box geoms are found). A bagel
# left on the TABLE beside the tray is outside the footprint -> RED.
# `must_hold: true` rejects a bagel that slid back off the tray by the final
# frame.
#
# The three bagel regions are physically disjoint, not merely disjoint as
# point-sampling boxes. Their y centres are 0.22 m apart with only 0.03 m y
# jitter, leaving at least 0.03 m between the two largest collision footprints
# even in the worst opposing samples. The x range remains episode-random while
# keeping every bagel footprint inside the compact table edge.
regions:
  tray_zone:
    center:
    - -0.12
    - 0.0295
    - 0.85
    xy_range:
    - 0.04
    - 0.04
    yaw_range:
    - 0.0
    - 0.0
    rest_on_surface: true
  bg0_zone:

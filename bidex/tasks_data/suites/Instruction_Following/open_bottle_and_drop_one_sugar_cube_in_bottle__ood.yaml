# `in_bottle` resolves the bottle's live body xpos directly (no region/target)
# and counts a cube anywhere in the body height (origin-0.05 < cube_z <
# origin+0.20) within the xy footprint -- a cube perched on the mouth rim does
# NOT count, only one inside the body. `not_in_bottle` / `not_lifted` use
# `latch_violation: true`: entering the bottle / being picked up is transient,
# so latch a PERMANENT failure the first frame it happens -- a forbidden cube
# dropped in then pulled out (or lifted then released) must NOT recover its
# green light.
- type: in_bottle
  args:
  - rc/lightwheel/sugar_cube/SugarCube003
  - a_classic_occ_bottle_with_articulated_cap
  subtask: Right arm drops the first sugar cube into the bottle

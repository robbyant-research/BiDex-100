    center:
    - -0.18
    - 0.0
    - 0.95
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - 0.0
    - 0.01
  strainer_zone:
    center:
    - 0.2792
    - -0.1994
    - 0.85
    xy_range:
    - 0.06
    - 0.06
    yaw_range:
    - -0.1
    - 0.1
    rest_on_surface: true
  tomato_a_zone:
    center:
    - 0.2
    - 0.28
    - 0.85
    xy_range:
    - 0.05
    - 0.05
    yaw_range:
    - -3.14
    - 3.14
  tomato_b_zone:

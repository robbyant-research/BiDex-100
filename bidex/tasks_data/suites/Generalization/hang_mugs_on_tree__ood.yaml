# OOD variant of tabletop_hang_mugs_on_tree (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + BAKED distractors.
# (Random 5.3 distractor injection is disabled: injected cups / a digital scale /
# a measuring cup repeatedly spawned overlapping the mug tree and the two task
# mugs. A cup and an orange are baked below on the far -x side instead.)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
name: hang_mugs_on_tree
language: Pick up each of the two mugs and hang them both on the wooden mug tree.
subtasks:
- name: Pick up the first mug
  score: 10
- name: Hang the first mug on the mug tree
  score: 40
- name: Pick up the second mug
  score: 10
- name: Hang the second mug on the mug tree
  score: 40
ood:
  base_task: tabletop_hang_mugs_on_tree
  scene_randomize: true
  baked_layout: true
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
regions:
  # mug_a's OOD centre (0.3111, 0.2338) + 0.10 jitter put its spawn box at
  # x up to 0.411 -- past the table edge (x max 0.40), so a mug could spawn
  # unsupported and fall. Pulled in to (0.29, 0.22): spawn box x <= 0.39.
  mug_a_zone:
    center:
    - 0.29
    - 0.22
    - 0.85
    xy_range:
    - 0.1
    - 0.1
    yaw_range:
    - 1.047
    - 2.094
  mug_b_zone:
    center:
    - 0.2482
    - -0.2155
    - 0.85
    xy_range:
    - 0.1
    - 0.1
    yaw_range:
    - 1.047
    - 2.094
  # Baked OOD distractors on the far -x side, clear of the tree
  # (x[-0.015,0.115] y[-0.062,0.062]) and of mug_a x[0.15,0.43] / mug_b
  # x[0.11,0.39]:
  #   new mug: x[-0.344,-0.157] y[0.063,0.237]
  #   orange:  x[-0.318,-0.182] y[-0.218,-0.082]
  ood_mug_zone:
    center:
    - -0.25
    - 0.15
    - 0.8
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - 1.047
    - 2.094
    rest_on_surface: true
  ood_orange_zone:
    center:
    - -0.25
    - -0.15
    - 0.8
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
objects:
- name: mug_tree
  pos:
  - 0.05
  - 0.0
  - 0.85
  quat:
  - 1
  - 0
  - 0
  - 0
  scale: 1.1
  freejoint: false
- name: rc/objaverse/mug/mug_8
  region: mug_a_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/mug/mug_16
  region: mug_b_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/mug/mug_9
  region: ood_mug_zone
  scale: 1
  freejoint: true
- name: rc/objaverse/orange/orange_4
  region: ood_orange_zone
  scale: 1
  freejoint: true
fixtures: []
goal:
# hung_on (NOT `on`): see the base yaml -- a touch-and-topple used to latch
# success; now the mug must be peg-supported (vertical-normal contact at peg
# height) and still hanging at the final frame. Thresholds relaxed vs the base to
# cut FALSE NEGATIVES: contact_dz 0.05 (`threshold`) and normal_z_min 0.35
# (args[2]) -- a tilted/swung mug up to ~69 deg still reads peg-supported, while
# a mug leaning on the trunk or resting on the base/feet is still rejected.
- type: lifted
  args:
  - rc/objaverse/mug/mug_8
  subtask: Pick up the first mug
- type: hung_on
  args:
  - rc/objaverse/mug/mug_8
  - mug_tree
  - 0.35
  subtask: Hang the first mug on the mug tree
  threshold: 0.05
  must_hold: true
- type: lifted
  args:
  - rc/objaverse/mug/mug_16
  subtask: Pick up the second mug
- type: hung_on
  args:
  - rc/objaverse/mug/mug_16
  - mug_tree
  - 0.35
  subtask: Hang the second mug on the mug tree
  threshold: 0.05
  must_hold: true
obj_of_interest:
- mug_tree
- rc/objaverse/mug/mug_8
- rc/objaverse/mug/mug_16

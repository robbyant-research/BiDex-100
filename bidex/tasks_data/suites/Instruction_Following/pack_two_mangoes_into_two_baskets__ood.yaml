# Exclusion constraints: each basket must hold EXACTLY one mango. The two
# mangoes not assigned to a basket (mango_4, mango_5) must never end up in
# either basket. `not_inside` is the exact negation of `inside`; we use
# `latch_violation: true` (NOT must_hold): a forbidden mango entering a basket
# is a transient event (it can be lifted out again) and `inside` detection at
# the rim is noisy, so a final-frame `must_hold` check would let the violation
# recover and would flicker with the detection. `latch_violation` latches a
# PERMANENT failure the first frame the extra mango is in a basket -- the green
# light goes off and STAYS off, no recovery, no flicker.

# OOD variant of tabletop_store_frozen_food (auto-generated by scripts/gen_ood_yamls.py).
# Active OOD features: scene_randomize(5.1) + region_offset(5.2) + distractors(5.3)
# ID evaluation uses the base yaml; this file is only loaded for --domain out_of_domain (seeds 2,3).
articulations:
- joint: body_to_lid
  object: chest_freezer_with_hinged_lid
  qpos: 0
fixtures: []
ordered_subtasks: true
goal:
- type: open
  args:
  - chest_freezer_with_hinged_lid
  - body_to_lid
  subtask: Open the chest freezer lid
  order_group: food
- type: lifted
  args:
  - ice_cube
  subtask: Pick up the ice cubes
  order_group: food
# inside_contact (NOT position `inside`): the freezer is FREE-JOINTED and can
# TIP over; the old `inside` (xy radius 0.22 + z window 0.25) then counted an
# ice_cube / boxed_food resting OUTSIDE the tipped chest against its base -- a
# false success. inside_contact requires a SUPPORT contact (vertical-normal
# contact, freezer floor/liner beneath the item), so only an item actually
# resting IN the freezer latches. must_hold rejects an item that later falls out.
- type: inside_contact
  args:
  - ice_cube
  - chest_freezer_with_hinged_lid
  subtask: Put the ice cubes inside the freezer
  must_hold: true
  order_group: food
- type: lifted
  args:
  - boxed_food
  subtask: Pick up the boxed food
  order_group: food
- type: inside_contact
  args:
  - boxed_food
  - chest_freezer_with_hinged_lid
  subtask: Put the boxed food inside the freezer
  must_hold: true
  order_group: food
- type: closed
  args:
  - chest_freezer_with_hinged_lid
  - body_to_lid
  subtask: Close the freezer lid
language: Open the chest freezer lid, put the ice cubes and boxed food inside, then close the freezer lid.
subtasks:
- name: Open the chest freezer lid
  score: 20
- name: Pick up the ice cubes
  score: 20
- name: Put the ice cubes inside the freezer
  score: 20
- name: Pick up the boxed food
  score: 15
- name: Put the boxed food inside the freezer
  score: 20
- name: Close the freezer lid
  score: 5
ood:
  base_task: tabletop_store_frozen_food
  scene_randomize: true
  baked_layout: true
  distractors:
    count: 3
name: store_frozen_food_in_freezer
obj_of_interest:
- chest_freezer_with_hinged_lid
- ice_cube
- boxed_food
objects:
- name: chest_freezer_with_hinged_lid
  region: freezer_zone
  scale: 0.6
  freejoint: true
  mass: 1.35
- name: ice_cube
  region: ice_cube_zone
  scale: 0.7
  freejoint: true
- name: boxed_food
  region: frozen_bag_zone
  scale: 1
  freejoint: true
regions:
  freezer_zone:
    center:
    - 0
    - 0.15
    - 0.85
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - -0.1
    - 0.1
  # The freezer's physical body is 0.28 x 0.34 m at scale 0.6 (footprint
  # 0.14 x 0.17 m) -- far bigger than its 0.02-m placement box suggests: its
  # body spans y[-0.04, 0.34] (and x up to +0.16 with jitter). The previous
  # OOD offsets moved the food zones right up against it (frozen_bag y max
  # overlapped the freezer's front wall, ice_cube x min overlapped its +x
  # side) so items could spawn embedded in / dropped inside the chest.
  # frozen_bag keeps a clear southern strip: body y max -0.14+0.03+0.06 = -0.05
  # < freezer y min -0.04. ice_cube keeps x clear: body x min
  # 0.23-0.03-0.014 = 0.186 > freezer x max 0.16.
  frozen_bag_zone:
    center:
    - 0.17
    - -0.14
    - 0.85
    xy_range:
    - 0.03
    - 0.03
    yaw_range:
    - -0.2
    - 0.2
  ice_cube_zone:
    center:
    - 0.23
    - 0.15
    - 0.85
    xy_range:
    - 0.03
    - 0.03
    yaw_range:
    - -0.3
    - 0.3
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style

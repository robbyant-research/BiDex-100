name: swap_cup_colors_with_cube
language: With the right arm press the yellow button three times, pick up the cube
  and swing it over the two cups five times to swap their colors, then place it in
  the matching-color cup.
subtasks:
- name: Right arm presses the yellow button exactly three times, the cube's color
    disappears
  score: 25
- name: Pick up the cube
  score: 5
- name: Pass over the cups so the two cups swap colors five times
  score: 25
- name: Place the cube into the cup whose color matches it
  score: 45

name: drop_fruits_in_basket_then_remove_in_order
# Left arm drops the three fruit objects into the basket one by one, in any order
# (the order changes each episode -- the operator/teleop chooses it). Right arm
# then takes them back OUT of the basket in the SAME order they went in. The env
# records the observed place-order and remove-order on the basket object; the
# `order_match` goal succeeds only when the two sequences are identical (all
# three placed and removed in the same order). A wrong removal order never
# latches -> the task fails, which is the desired "wrong order = error".
language: With the left arm drop the three fruits into the basket in any order, then with the right arm take them back out in the same order they went in.
subtasks:
- name: Left arm places all three objects into the basket
  score: 50
- name: Right arm removes all three in the order they were placed
  score: 50
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# The two subtasks must complete in order: the remove-order check may only latch
# once all three objects have been placed, otherwise `order_match` could be
# (trivially) true before any object is removed.
ordered_subtasks: true
regions:
  # All three fruits start scattered on the table IN FRONT of the basket
  # (negative y, toward the robot), well outside the basket's xy footprint so
  # `place_seq` starts empty. One shared zone + min_distance lets the sampler
  # scatter them without overlapping each other or embedding at spawn.
  # (The basket itself is a welded fixture -- see `objects` -- so it has no
  # spawn region; it is fixed at an explicit pose and never re-sampled.)
  fruit_start_zone:
    center:
    - 0.10
    - -0.25
    - 0.85
    xy_range:
    - 0.12
    - 0.04
    yaw_range:
    - -3.14
    - 3.14
    min_distance: 0.08
objects:
  # The basket is WELDED in place: `freejoint: false` + an explicit pos/quat bakes
  # its pose into the MJCF as a static (joint-less) body, so it is truly
  # immovable -- no need to inflate its mass. It sits with its base on the table
  # top (z = 0.8). Basket045 is a shallow square tray; at scale 0.7 its interior
  # is ~25 cm wide with ~7.7 cm walls, so the three ~6 cm fruits sit side by side
  # with their tops only ~2 cm below the rim -- the right arm can pluck any one
  # out independently (FIFO is physically achievable, not a forced stack). The
  # previous Basket026 was ~13 cm deep at this scale and too deep to remove from.
  # `basket: true` marks it as the container the env's order-tracker monitors;
  # the tracker reads the basket's live `reg_bbox` geom, which works for a welded
  # body exactly as for a freejoint one.
- name: rc/lightwheel/basket/Basket045
  pos:
  - 0.10
  - 0.0
  - 0.8
  quat:
  - 1
  - 0
  - 0
  - 0
  scale: 0.7
  freejoint: false
  basket: true
# Three distinct, graspable fruit objects. `orderable: true` marks each as a
# tracked item; the env appends its catalog name to the basket's place_seq on
# first entry and remove_seq on first exit, and `order_match` compares the two.
# Distinct catalog names (peach/lime/apple) so the order-tracker records an
# unambiguous per-object identity.
- name: rc/objaverse/peach/peach_0
  region: fruit_start_zone
  orderable: true
- name: rc/objaverse/lime/lime_0
  region: fruit_start_zone
  orderable: true
- name: rc/objaverse/apple/apple_0
  region: fruit_start_zone
  orderable: true
fixtures: []
goal:
# Step 1: the left arm has placed all three objects into the basket (milestone).
# `placed_n` reads basket.place_seq (env-populated) and latches once its length
# reaches 3. This is a pure milestone (no must_hold) -- once placed, the objects
# may be partly removed again as the right arm starts work.
- type: placed_n
  args:
  - rc/lightwheel/basket/Basket045
  - 3
  subtask: Left arm places all three objects into the basket
# Step 2: the right arm removes all three in the SAME order they were placed.
# `order_match` reads basket.place_seq / remove_seq and is true only when all
# three are placed AND removed AND place_seq == remove_seq. must_hold pins it to
# the final frame: a correct order latches and keeps holding; a wrong order is
# never true, so the subtask never latches and the task fails.
- type: order_match
  args:
  - rc/lightwheel/basket/Basket045
  must_hold: true
  subtask: Right arm removes all three in the order they were placed
obj_of_interest:
- rc/lightwheel/basket/Basket045
- rc/objaverse/peach/peach_0
- rc/objaverse/lime/lime_0
- rc/objaverse/apple/apple_0

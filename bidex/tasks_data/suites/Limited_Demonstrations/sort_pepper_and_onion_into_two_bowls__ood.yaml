# Every object is from a previously-UNTOUCHED category: bell_pepper_2/3 (0/1 are
# used elsewhere), onion_1/2 (onion_0 is used elsewhere), bowl_5 and bowl_7
# (free bowl instances). This is the TWO-CONTAINER SORT archetype (new vs the
# single-container put-into batch): two item TYPES must be separated into two
# DISTINCT containers. bowl_5 (peppers, ~11.5 cm) and bowl_7 (onions, ~13 cm)
# are heavy stations (freejoint + mass 200, rest_on_surface true, yaw pinned 0)
# on the -x side; the two ~7.6 x 10 cm bell peppers spawn in a +y row on the +x
# side and the two ~6.4 x 6.7 cm onions in a -y row.
#
# `inside_contact` (support contact) gates EACH placement: a pepper counts only
# when it has a SUPPORT contact with bowl_5's body subtree, an onion only with
# bowl_7 -- so a pepper dropped into bowl_7 (wrong bowl) reads RED for its
# pepper goal, and a vegetable on the TABLE reads RED for both. `must_hold:
# true` rejects anything that bounced out. Parallel (no ordering): each arm
# handles its own kind.
#
# Worst-case spawn boxes (region jitter + collision footprint, peppers/onions get
# a full 360 deg yaw so their footprint is their diagonal radius) are DISJOINT:
#   bowls at x[-0.227,-0.005], y -/+0.16; peppers at (0.24,-0.09) & (0.10,-0.26);
#   onions at (0.24,0.09) & (0.10,0.26), jitter 0.03/0.015-0.012.
# The two peppers / two onions are arranged on a DIAGONAL with a >=1.1 cm y-gap
# (the previous 0.14 m x-spaced same-row boxes overlapped by ~2.5 cm once the
# ~0.13 m pepper diagonal footprint is added -> peppers could spawn embedded);
# bowl-to-veg x-clearance is >=1.4 cm; pepper row vs onion row is y-separated.
# Two small distractors (tomato at (-0.295,0), egg at (-0.28,-0.27)) sit far -x.

# Only TWO nails (nail_1, nail_2) may be driven. The other two (nail_3,
# nail_4) must NOT be hammered into the board. `not_sunk` is the negation of
# `sunk` (same 0.04m depth); `must_hold: true` makes it a live check at
# episode end. Nails are mocap-driven downward monotonically, so any strike
# that sinks a nail stays sunk to the end and is caught.
- type: not_sunk
  args:
  - dexjoco_nail_3
  subtask: Extra left nail is not driven into the board
  threshold: 0.04
  must_hold: true
- type: not_sunk

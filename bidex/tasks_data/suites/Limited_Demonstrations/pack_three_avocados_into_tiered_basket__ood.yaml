  # Baked OOD distractors, clear of the basket (x max 0.091) and the avocado
  # column (x min 0.145):
  #   tomato: x[-0.135,-0.025] y[0.29,0.40]   (top strip, x-clear of both)
  #   ice:    x[0.012,0.088]    y[-0.358,-0.282] (below the basket's y min -0.208)

# From the tray of mixed utensils, pick up the one target spoon and drop it into the cup.
name: pick_up_spoon_from_tray_into_cup
language: From the tray of mixed utensils, pick up the one target spoon and drop it into the cup.
subtasks:
- name: Pick up the target utensil and drop it into the cup
  score: 100
- name: Another utensil is not picked up
  score: 0
robot_type: dual_fr3v2_sharpa
scene: libero_tabletop_base_style
max_seconds: 180
robot_pose:
  pos:
  - 0.5
  - -0.45
  - 0.6
  quat:
  - 0.382683
  - 0
  - 0
  - 0.92388
# FIND-THE-TARGET task. Five utensils lie in the welded tray (OvenTray003) and the
# robot must pick up ONLY the target (spoon_12) and drop it into the cup; the
# other four (fork_2, spoon_11, knife_10, ladle_1) are guarded by `not_lifted`
# latch_violation, so touching any of them fails the episode. Two spoons are
# present (spoon_11 decoy + spoon_12 target) so the robot must visually
# distinguish the right one, not just grab "the spoon".
#
# shuffle_regions (opt-in, see Task.shuffle_regions / region_sampler): the five
# utensils' region assignment is randomly PERMUTED each reset, so the target and
# decoys swap tray slots every episode. The slots (u0..u4) are pinned
# (xy_range 0), tray-relative (`target: obj1_root`), and 8 cm apart along the
# tray's x -- the utensils lie along the tray's y (yaw pinned near 0), so any
# permutation keeps them in distinct, non-overlapping slots (the permutation
# only changes WHO is in which slot, not the slot geometry; rejection across
# swapped regions is not re-run because the slots are themselves pinned
# disjoint boxes). The tray (welded tray_zone) and the cup (cup_zone) are NOT in
# the shuffle group, so their placement is unchanged; only the utensil order in
# the tray shuffles. Default-off for every other task (shuffle_regions absent),
# so previously-collected tasks are unaffected (and collected init_states bypass
# RegionSampler entirely on restore).
regions:
  tray_zone:
    center:
    - -0.05
    - 0.0
    - 0.85
    xy_range:
    - 0.02
    - 0.02
    yaw_range:
    - 0.0
    - 0.01
    rest_on_surface: true
  cup_zone:
    center:
    - 0.22
    - 0.2
    - 0.85
    xy_range:
    - 0.03
    - 0.03
    yaw_range:
    - -3.14
    - 3.14
    rest_on_surface: true
  u0_zone:
    center:
    - -0.16
    - 0.0
    - 0.02
    xy_range:
    - 0
    - 0
    yaw_range:
    - 3.09159
    - 3.19159
    target: obj1_root
    rest_on_surface: true
  u1_zone:
    center:
    - -0.08
    - 0.0
    - 0.02
    xy_range:
    - 0
    - 0
    yaw_range:
    - 3.09159
    - 3.19159
    target: obj1_root
    rest_on_surface: true
  u2_zone:
    center:
    - 0.0
    - 0.0
    - 0.02
    xy_range:
    - 0
    - 0
    yaw_range:
    - 3.09159
    - 3.19159
    target: obj1_root
    rest_on_surface: true
  u3_zone:
    center:
    - 0.08
    - 0.0
    - 0.02
    xy_range:
    - 0
    - 0
    yaw_range:
    - 3.09159
    - 3.19159
    target: obj1_root
    rest_on_surface: true
  u4_zone:
    center:
    - 0.16
    - 0.0
    - 0.02
    xy_range:
    - 0
    - 0
    yaw_range:
    - 3.09159
    - 3.19159
    target: obj1_root
    rest_on_surface: true
shuffle_regions:
- rc/objaverse/fork/fork_2
- rc/objaverse/spoon/spoon_11
- rc/objaverse/knife/knife_10
- rc/objaverse/spoon/spoon_13
- rc/objaverse/spoon/spoon_12
objects:
- name: rc/lightwheel/oven_tray/OvenTray003
  region: tray_zone
  freejoint: false
  scale: 1.3
- name: rc/objaverse/fork/fork_2
  region: u0_zone
  freejoint: true
- name: rc/objaverse/spoon/spoon_11
  region: u1_zone
  freejoint: true
- name: rc/objaverse/knife/knife_10
  region: u2_zone
  freejoint: true
- name: rc/objaverse/spoon/spoon_13
  region: u3_zone
  freejoint: true
- name: rc/objaverse/spoon/spoon_12
  region: u4_zone
  freejoint: true
- name: rc/lightwheel/glass_cup/GlassCup005
  region: cup_zone
  freejoint: true
fixtures: []
goal:
# `axis_in_region` accepts any part of the spoon's long axis strictly inside the
# cup's live 3-D `reg_int`. The geom itself supplies the floor and rim bounds,
# so shallow insertion counts while crossing above or beside the cup does not.
- type: axis_in_region
  args:
  - rc/objaverse/spoon/spoon_12
  - rc/lightwheel/glass_cup/GlassCup005
  - reg_int
  - reg_bbox
  subtask: Pick up the target utensil and drop it into the cup
  must_hold: true
- type: not_lifted
  args:
  - rc/objaverse/spoon/spoon_11
  subtask: Another utensil is not picked up
  latch_violation: true
- type: not_lifted
  args:
  - rc/objaverse/knife/knife_10
  subtask: Another utensil is not picked up
  latch_violation: true
- type: not_lifted
  args:
  - rc/objaverse/spoon/spoon_13
  subtask: Another utensil is not picked up
  latch_violation: true
- type: not_lifted
  args:
  - rc/objaverse/fork/fork_2
  subtask: Another utensil is not picked up
  latch_violation: true
obj_of_interest:
- rc/lightwheel/oven_tray/OvenTray003
- rc/objaverse/fork/fork_2
- rc/lightwheel/glass_cup/GlassCup005
- rc/objaverse/spoon/spoon_11
- rc/objaverse/knife/knife_10
- rc/objaverse/spoon/spoon_13
- rc/objaverse/spoon/spoon_12

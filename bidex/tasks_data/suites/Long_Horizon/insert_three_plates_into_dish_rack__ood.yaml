    - 0.2837
    - 0.0086
    - 0.85
    xy_range:
    - 0.06
    - 0.06
    yaw_range:
    - -0.3
    - 0.3
  plate_c_zone:
    center:
    - 0.2837
    - -0.2414
    - 0.85
    xy_range:
    - 0.06
    - 0.06
    yaw_range:
    - -0.3
    - 0.3
